name = "PCSStatistics"
version = "0.1.0"
defaultTargets = ["PCSStatistics"]

# Mathlib-dependent statistical gate library.  Kept separate from the Std-only PCS proof
# core; joins the root project later via an exact Git dependency (never a local path).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8f9d9cff6bd728b17a24e163c9402775d9e6a365"

[[lean_lib]]
name = "PCSStatistics"
roots = ["PCSStatistics.Gates"]
