name = "PCS"
version = "0.5.0"
defaultTargets = ["PCS", "pcs-lean-authority", "pcs-semantic-check", "PCSCountermodel", "pcs-countermodel-replay", "PCSOmega", "PCSDecisionDiagram"]

[[lean_lib]]
name = "PCS"
# Elaborate and kernel-check the entire proof-only umbrella without emitting native object files (Lean 4.28 uses leanArts).
defaultFacets = ["leanArts"]

[[lean_exe]]
name = "pcs-lean-authority"
root = "PCSAuthority"

[[lean_exe]]
name = "pcs-semantic-check"
root = "PCSSemanticCheck"

[[lean_lib]]
name = "PCSCountermodel"
roots = ["PCSCountermodel"]
defaultFacets = ["leanArts"]

[[lean_exe]]
name = "pcs-countermodel-replay"
root = "PCSCountermodelReplay"

# Experimental typed reference models (no PCS authority; not imported by PCS/PCSAuthority).
[[lean_lib]]
name = "PCSOmega"
moreLeanArgs = ["-j1", "-M6000", "-D", "Elab.async=false"]
roots = ["PCSOmega"]
defaultFacets = ["leanArts"]

[[lean_lib]]
name = "PCSDecisionDiagram"
moreLeanArgs = ["-j1", "-M6000", "-D", "Elab.async=false"]
roots = ["PCSDecisionDiagram"]
defaultFacets = ["leanArts"]

# Executed positive controls for the experimental models (kernel-checked `decide`).
[[lean_lib]]
name = "PCSControls"
moreLeanArgs = ["-j1", "-M6000", "-D", "Elab.async=false"]
roots = ["PCSOmega.Controls", "PCSDecisionDiagram.Controls"]
defaultFacets = ["leanArts"]
