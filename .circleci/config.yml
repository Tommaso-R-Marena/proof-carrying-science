version: 2.1

commands:
  setup-python:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip

  install-pcs:
    steps:
      - setup-python
      - run:
          name: Install PCS
          command: |
            . .venv/bin/activate
            python -m pip install -e .

jobs:
  produce-signed-campaign:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-python
      - run:
          name: Install PCS with test dependencies
          command: |
            . .venv/bin/activate
            python -m pip install -e ".[dev]"
      - run:
          name: Run replay regression gate
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_environment_execute_v06.py tests/test_environment_workspace_v06.py tests/test_environment_replay_v06.py tests/test_workflow_replay_v06.py
      - run:
          name: Produce signed multi-architecture campaign
          command: |
            rm -rf /tmp/pcs-cross-machine
            mkdir -p /tmp/pcs-cross-machine
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py produce --output /tmp/pcs-cross-machine/bundles
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - bundles

  replay-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Replay signed variants on amd64
          command: |
            mkdir -p /tmp/pcs-cross-machine/results
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py replay --input /tmp/pcs-cross-machine/bundles --output /tmp/pcs-cross-machine/results/circleci-ubuntu24-amd64 --machine-id circleci-ubuntu24-amd64
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - results/circleci-ubuntu24-amd64

  replay-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Replay signed variants on arm64
          command: |
            mkdir -p /tmp/pcs-cross-machine/results
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py replay --input /tmp/pcs-cross-machine/bundles --output /tmp/pcs-cross-machine/results/circleci-ubuntu24-arm64 --machine-id circleci-ubuntu24-arm64
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - results/circleci-ubuntu24-arm64

  replay-ubuntu22-amd64:
    machine:
      image: ubuntu-2204:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Replay signed variants on Ubuntu 22.04 amd64
          command: |
            uname -a
            cat /etc/os-release
            docker version
            mkdir -p /tmp/pcs-cross-machine/results
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py replay --input /tmp/pcs-cross-machine/bundles --output /tmp/pcs-cross-machine/results/circleci-ubuntu22-amd64 --machine-id circleci-ubuntu22-amd64
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - results/circleci-ubuntu22-amd64
      - store_artifacts:
          path: /tmp/pcs-cross-machine/results/circleci-ubuntu22-amd64
          destination: circleci-ubuntu22-amd64

  det-01:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - run:
          name: Determinism diagnostic runs-completed
          command: |
            python scripts/check_determinism_component.py --input /tmp/pcs-cross-machine/results --mode runs-completed

  det-02:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - run:
          name: Determinism diagnostic runs-valid
          command: |
            python scripts/check_determinism_component.py --input /tmp/pcs-cross-machine/results --mode runs-valid

  det-03:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - run:
          name: Determinism diagnostic projection-match
          command: |
            python scripts/check_determinism_component.py --input /tmp/pcs-cross-machine/results --mode projection-match

  det-04:
    docker:
      - image: cimg/python:3.12
    steps:
