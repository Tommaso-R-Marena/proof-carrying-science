version: 2.1

commands:
  setup-pcs:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e .

jobs:
  produce-oci-engine:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed OCI engine campaign
          command: |
            rm -rf /tmp/pcs-runtime-boundary
            mkdir -p /tmp/pcs-runtime-boundary
            . .venv/bin/activate
            python scripts/oci_engine_campaign.py produce --output /tmp/pcs-runtime-boundary/oci-bundle
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - oci-bundle
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/oci-bundle/campaign.json
          destination: oci-engine/producer-campaign.json

  replay-docker:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-runtime-boundary
      - setup-pcs
      - run:
          name: Replay signed bundle with Docker
          command: |
            mkdir -p /tmp/pcs-runtime-boundary/oci-results
            . .venv/bin/activate
            python scripts/oci_engine_campaign.py replay               --input /tmp/pcs-runtime-boundary/oci-bundle               --output /tmp/pcs-runtime-boundary/oci-results/docker               --runtime docker               --machine-id circleci-docker-amd64
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - oci-results/docker
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/oci-results/docker
          destination: oci-engine/docker

  replay-podman:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-runtime-boundary
      - setup-pcs
      - run:
          name: Install Podman
          command: |
            sudo apt-get update
            sudo apt-get install -y podman uidmap
            sudo podman --version
            sudo podman info
      - run:
          name: Replay signed bundle with rootful Podman
          command: |
            mkdir -p /tmp/pcs-runtime-boundary/oci-results
            sudo "$PWD/.venv/bin/python" scripts/oci_engine_campaign.py replay               --input /tmp/pcs-runtime-boundary/oci-bundle               --output /tmp/pcs-runtime-boundary/oci-results/podman               --runtime podman               --machine-id circleci-podman-amd64
            sudo chmod -R a+rX /tmp/pcs-runtime-boundary/oci-results/podman
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - oci-results/podman
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/oci-results/podman
          destination: oci-engine/podman

  aggregate-oci-engine:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-runtime-boundary
      - setup-pcs
      - run:
          name: Assert Docker vs Podman evidence
          command: |
            . .venv/bin/activate
            python scripts/oci_engine_campaign.py aggregate               --input /tmp/pcs-runtime-boundary/oci-results               --output /tmp/pcs-runtime-boundary/oci-engine-summary.json
            cat /tmp/pcs-runtime-boundary/oci-engine-summary.json
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - oci-engine-summary.json
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/oci-engine-summary.json
          destination: oci-engine-summary.json

  produce-r-runtime:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed R-native campaign
          command: |
            mkdir -p /tmp/pcs-runtime-boundary
            . .venv/bin/activate
            python scripts/r_runtime_campaign.py produce --output /tmp/pcs-runtime-boundary/r-bundle
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - r-bundle
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/r-bundle/campaign.json
          destination: r-runtime/producer-campaign.json

  replay-r-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-runtime-boundary
      - setup-pcs
      - run:
          name: Replay R-native bundle on amd64
          command: |
            mkdir -p /tmp/pcs-runtime-boundary/r-results
            . .venv/bin/activate
            python scripts/r_runtime_campaign.py replay               --input /tmp/pcs-runtime-boundary/r-bundle               --output /tmp/pcs-runtime-boundary/r-results/amd64               --machine-id circleci-r-amd64
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - r-results/amd64
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/r-results/amd64
          destination: r-runtime/amd64

  replay-r-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-runtime-boundary
      - setup-pcs
      - run:
          name: Replay R-native bundle on ARM64
          command: |
            mkdir -p /tmp/pcs-runtime-boundary/r-results
            . .venv/bin/activate
            python scripts/r_runtime_campaign.py replay               --input /tmp/pcs-runtime-boundary/r-bundle               --output /tmp/pcs-runtime-boundary/r-results/arm64               --machine-id circleci-r-arm64
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - r-results/arm64
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/r-results/arm64
          destination: r-runtime/arm64

  replay-r-podman-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-runtime-boundary
      - setup-pcs
      - run:
          name: Install Podman
          command: |
            sudo apt-get update
            sudo apt-get install -y podman uidmap
            sudo podman --version
      - run:
          name: Replay R-native bundle with rootful Podman
          command: |
            mkdir -p /tmp/pcs-runtime-boundary/r-results
            sudo "$PWD/.venv/bin/python" scripts/r_runtime_campaign.py replay               --input /tmp/pcs-runtime-boundary/r-bundle               --output /tmp/pcs-runtime-boundary/r-results/podman-amd64               --machine-id circleci-r-podman-amd64               --runtime podman
            sudo chmod -R a+rX /tmp/pcs-runtime-boundary/r-results/podman-amd64
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - r-results/podman-amd64
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/r-results/podman-amd64
          destination: r-runtime/podman-amd64

  aggregate-r-runtime:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-runtime-boundary
      - setup-pcs
      - run:
          name: Assert R runtime evidence
          command: |
            . .venv/bin/activate
            python scripts/r_runtime_campaign.py aggregate               --input /tmp/pcs-runtime-boundary/r-results               --output /tmp/pcs-runtime-boundary/r-runtime-summary.json
            cat /tmp/pcs-runtime-boundary/r-runtime-summary.json
      - persist_to_workspace:
          root: /tmp/pcs-runtime-boundary
          paths:
            - r-runtime-summary.json
      - store_artifacts:
          path: /tmp/pcs-runtime-boundary/r-runtime-summary.json
          destination: r-runtime-summary.json

  runtime-boundaries-complete:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Boundary campaigns complete
          command: echo "Docker vs Podman and R runtime campaigns both passed."

workflows:
  runtime-boundary-evidence:
    jobs:
      - produce-oci-engine:
          filters: &pcs_branch
            branches:
              only: v06/replay-normalized-wire-v2
      - replay-docker:
          requires:
            - produce-oci-engine
          filters: *pcs_branch
      - replay-podman:
          requires:
            - produce-oci-engine
          filters: *pcs_branch
      - aggregate-oci-engine:
          requires:
            - replay-docker
            - replay-podman
          filters: *pcs_branch
      - produce-r-runtime:
          filters: *pcs_branch
      - replay-r-amd64:
          requires:
            - produce-r-runtime
          filters: *pcs_branch
      - replay-r-arm64:
          requires:
            - produce-r-runtime
          filters: *pcs_branch
      - replay-r-podman-amd64:
          requires:
            - produce-r-runtime
          filters: *pcs_branch
      - aggregate-r-runtime:
          requires:
            - replay-r-amd64
            - replay-r-arm64
            - replay-r-podman-amd64
          filters: *pcs_branch
      - runtime-boundaries-complete:
          requires:
            - aggregate-oci-engine
            - aggregate-r-runtime
          filters: *pcs_branch
