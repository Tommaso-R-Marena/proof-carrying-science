version: 2.1

commands:
  setup-pcs:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e .

jobs:
  restoration-test-1:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install test environment
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: test_vendored_python_wheels_are_signed_environment_sources
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_environment_v06.py::test_vendored_python_wheels_are_signed_environment_sources

  restoration-test-2:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install test environment
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: test_vendored_r_repository_payloads_are_signed_environment_sources
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_environment_v06.py::test_vendored_r_repository_payloads_are_signed_environment_sources

  restoration-test-3:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install test environment
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: test_discovery_promotes_vendored_restoration_artifacts_into_manifest
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_environment_v06.py::test_discovery_promotes_vendored_restoration_artifacts_into_manifest

  test-environment-executor:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install test environment
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Test realized environment executor
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_environment_execute_v06.py

  probe-python-wheel-restore:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Probe dual-architecture wheel resolution and offline restore
          command: |
            set -eu
            rm -rf /tmp/wheel-probe
            mkdir -p /tmp/wheel-probe/wheelhouse
            . .venv/bin/activate
            python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps               --dest /tmp/wheel-probe/wheelhouse               --platform manylinux2014_x86_64 --implementation cp --python-version 312 --abi cp312               'orjson>=3.10,<4'
            VERSION=$(python - <<'PY'
            import re
            from pathlib import Path
            wheels=list(Path("/tmp/wheel-probe/wheelhouse").glob("orjson-*.whl"))
            assert len(wheels)==1, wheels
            m=re.match(r"orjson-([0-9][^-]*)-",wheels[0].name,re.I)
            assert m, wheels[0].name
            print(m.group(1))
            PY
            )
            python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps               --dest /tmp/wheel-probe/wheelhouse               --platform manylinux2014_aarch64 --implementation cp --python-version 312 --abi cp312               "orjson==$VERSION"
            python - <<'PY'
            from pathlib import Path
            import hashlib,re
            wheels=sorted(Path("/tmp/wheel-probe/wheelhouse").glob("orjson-*.whl"))
            assert len(wheels)==2, [x.name for x in wheels]
            versions={re.match(r"orjson-([0-9][^-]*)-",w.name,re.I).group(1) for w in wheels}
            assert len(versions)==1, versions
            lines=[f"orjson=={next(iter(versions))} \\"]
            for i,w in enumerate(wheels):
                h=hashlib.sha256(w.read_bytes()).hexdigest()
                lines.append(f"    --hash=sha256:{h}" + (" \\" if i < len(wheels)-1 else ""))
            Path("/tmp/wheel-probe/requirements.lock").write_text("\n".join(lines)+"\n")
            PY
            docker pull python:3.12-slim-bookworm
            DIGEST=$(docker buildx imagetools inspect python:3.12-slim-bookworm | awk '/^Digest:/ {print $2; exit}')
            cat > /tmp/wheel-probe/Dockerfile <<EOF
            FROM docker.io/library/python@$DIGEST
            ENV PYTHONDONTWRITEBYTECODE=1 PIP_DISABLE_PIP_VERSION_CHECK=1
            COPY wheelhouse /wheelhouse
            COPY requirements.lock /requirements.lock
            RUN python -m pip install --no-compile --no-index --find-links=/wheelhouse --require-hashes -r /requirements.lock
            EOF
            docker pull "docker.io/library/python@$DIGEST"
            docker build --network=none --no-cache --pull=false --provenance=false --sbom=false               -t pcs-wheel-probe /tmp/wheel-probe
            docker run --rm --network=none pcs-wheel-probe               python -c 'import orjson; print(orjson.__version__)'

  produce-python-wheel:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed hash-locked wheel campaign
          command: |
            rm -rf /tmp/pcs-restoration
            mkdir -p /tmp/pcs-restoration
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py produce               --output /tmp/pcs-restoration/python-bundle
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-bundle
      - store_artifacts:
          path: /tmp/pcs-restoration/python-bundle/campaign.json
          destination: python-wheel/producer-campaign.json

  replay-python-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed wheels and replay on amd64
          command: |
            mkdir -p /tmp/pcs-restoration/python-results
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py replay               --input /tmp/pcs-restoration/python-bundle               --output /tmp/pcs-restoration/python-results/amd64               --machine-id circleci-python-wheel-amd64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-results/amd64
      - store_artifacts:
          path: /tmp/pcs-restoration/python-results/amd64
          destination: python-wheel/amd64

  replay-python-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed wheels and replay on ARM64
          command: |
            mkdir -p /tmp/pcs-restoration/python-results
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py replay               --input /tmp/pcs-restoration/python-bundle               --output /tmp/pcs-restoration/python-results/arm64               --machine-id circleci-python-wheel-arm64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-results/arm64
      - store_artifacts:
          path: /tmp/pcs-restoration/python-results/arm64
          destination: python-wheel/arm64

  aggregate-python-wheel:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Assert hash-locked wheel and ABI evidence
          command: |
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py aggregate               --input /tmp/pcs-restoration/python-results               --output /tmp/pcs-restoration/python-wheel-summary.json
            cat /tmp/pcs-restoration/python-wheel-summary.json
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-wheel-summary.json
      - store_artifacts:
          path: /tmp/pcs-restoration/python-wheel-summary.json
          destination: python-wheel-summary.json

  produce-r-renv:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed offline renv campaign
          command: |
            mkdir -p /tmp/pcs-restoration
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py produce               --output /tmp/pcs-restoration/r-bundle
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-bundle
      - store_artifacts:
          path: /tmp/pcs-restoration/r-bundle/campaign.json
          destination: r-renv/producer-campaign.json

  replay-r-renv-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore renv lock and replay on amd64
          command: |
            mkdir -p /tmp/pcs-restoration/r-results
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py replay               --input /tmp/pcs-restoration/r-bundle               --output /tmp/pcs-restoration/r-results/amd64               --machine-id circleci-renv-amd64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-results/amd64
      - store_artifacts:
          path: /tmp/pcs-restoration/r-results/amd64
          destination: r-renv/amd64

  replay-r-renv-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore renv lock and replay on ARM64
          command: |
            mkdir -p /tmp/pcs-restoration/r-results
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py replay               --input /tmp/pcs-restoration/r-bundle               --output /tmp/pcs-restoration/r-results/arm64               --machine-id circleci-renv-arm64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-results/arm64
      - store_artifacts:
          path: /tmp/pcs-restoration/r-results/arm64
          destination: r-renv/arm64

  aggregate-r-renv:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Assert offline renv restoration evidence
          command: |
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py aggregate               --input /tmp/pcs-restoration/r-results               --output /tmp/pcs-restoration/r-renv-summary.json
            cat /tmp/pcs-restoration/r-renv-summary.json
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-renv-summary.json
      - store_artifacts:
          path: /tmp/pcs-restoration/r-renv-summary.json
          destination: r-renv-summary.json

  restoration-boundaries-complete:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Restoration campaigns complete
          command: echo "Python hash-locked wheel, ABI, and R renv restoration campaigns passed."

workflows:
  restoration-and-abi-evidence:
    jobs:
      - restoration-test-1:
          filters: &pcs_branch
            branches:
              only: v06/replay-normalized-wire-v2
      - restoration-test-2:
          filters: *pcs_branch
      - restoration-test-3:
          filters: *pcs_branch
      - test-environment-executor:
          filters: *pcs_branch
      - probe-python-wheel-restore:
          requires:
            - restoration-test-1
            - restoration-test-2
            - restoration-test-3
            - test-environment-executor
          filters: *pcs_branch
      - produce-python-wheel:
          requires:
            - probe-python-wheel-restore
          filters: *pcs_branch
      - replay-python-amd64:
          requires:
            - produce-python-wheel
          filters: *pcs_branch
      - replay-python-arm64:
          requires:
            - produce-python-wheel
          filters: *pcs_branch
      - aggregate-python-wheel:
          requires:
            - replay-python-amd64
            - replay-python-arm64
          filters: *pcs_branch
      - produce-r-renv:
          requires:
            - restoration-test-1
            - restoration-test-2
            - restoration-test-3
            - test-environment-executor
          filters: *pcs_branch
      - replay-r-renv-amd64:
          requires:
            - produce-r-renv
          filters: *pcs_branch
      - replay-r-renv-arm64:
          requires:
            - produce-r-renv
          filters: *pcs_branch
      - aggregate-r-renv:
          requires:
            - replay-r-renv-amd64
            - replay-r-renv-arm64
          filters: *pcs_branch
      - restoration-boundaries-complete:
          requires:
            - aggregate-python-wheel
            - aggregate-r-renv
          filters: *pcs_branch
