version: 2.1

jobs:
  probe-ubuntu22:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Probe Ubuntu 22.04 VM
          command: |
            uname -a
            cat /etc/os-release
            docker version
            python3 --version || true

  probe-ubuntu26:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Probe Ubuntu 26.04 VM
          command: |
            uname -a
            cat /etc/os-release
            docker version
            python3 --version || true

workflows:
  host-os-probe:
    jobs:
      - probe-ubuntu22
      - probe-ubuntu26
