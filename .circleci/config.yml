version: 2.1

commands:
  setup-pcs:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e .

jobs:
  restoration-regression:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install test environment
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Test restoration binding and realized native fingerprints
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_environment_v06.py::test_vendored_python_wheels_are_signed_environment_sources tests/test_environment_v06.py::test_vendored_r_repository_payloads_are_signed_environment_sources tests/test_environment_v06.py::test_discovery_promotes_vendored_restoration_artifacts_into_manifest tests/test_environment_execute_v06.py

  produce-python-wheel:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed NumPy wheelhouse campaign
          command: |
            rm -rf /tmp/pcs-restoration
            mkdir -p /tmp/pcs-restoration
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py produce --output /tmp/pcs-restoration/python-bundle
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-bundle

  replay-python-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed NumPy wheel and preserve evidence on amd64
          command: |
            mkdir -p /tmp/pcs-restoration/python-results
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py replay --input /tmp/pcs-restoration/python-bundle --output /tmp/pcs-restoration/python-results/amd64 --machine-id circleci-python-wheel-amd64 || true
            test -f /tmp/pcs-restoration/python-results/amd64/summary.json
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-results/amd64
      - store_artifacts:
          path: /tmp/pcs-restoration/python-results/amd64
          destination: python-wheel/amd64

  replay-python-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed NumPy wheel and preserve evidence on ARM64
          command: |
            mkdir -p /tmp/pcs-restoration/python-results
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py replay --input /tmp/pcs-restoration/python-bundle --output /tmp/pcs-restoration/python-results/arm64 --machine-id circleci-python-wheel-arm64 || true
            test -f /tmp/pcs-restoration/python-results/arm64/summary.json
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-results/arm64
      - store_artifacts:
          path: /tmp/pcs-restoration/python-results/arm64
          destination: python-wheel/arm64

  aggregate-python-wheel:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Assert hash-locked wheel and ABI evidence
          command: |
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py aggregate --input /tmp/pcs-restoration/python-results --output /tmp/pcs-restoration/python-wheel-summary.json
      - store_artifacts:
          path: /tmp/pcs-restoration/python-wheel-summary.json
          destination: python-wheel-summary.json

  produce-r-renv:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed offline renv campaign
          command: |
            mkdir -p /tmp/pcs-restoration
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py produce --output /tmp/pcs-restoration/r-bundle
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-bundle

  replay-r-renv-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore renv lock and replay on amd64
          command: |
            mkdir -p /tmp/pcs-restoration/r-results
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py replay --input /tmp/pcs-restoration/r-bundle --output /tmp/pcs-restoration/r-results/amd64 --machine-id circleci-renv-amd64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-results/amd64

  replay-r-renv-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore renv lock and replay on ARM64
          command: |
            mkdir -p /tmp/pcs-restoration/r-results
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py replay --input /tmp/pcs-restoration/r-bundle --output /tmp/pcs-restoration/r-results/arm64 --machine-id circleci-renv-arm64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-results/arm64

  aggregate-r-renv:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Assert offline renv restoration evidence
          command: |
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py aggregate --input /tmp/pcs-restoration/r-results --output /tmp/pcs-restoration/r-renv-summary.json
      - store_artifacts:
          path: /tmp/pcs-restoration/r-renv-summary.json
          destination: r-renv-summary.json

  check-python-valid:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - run:
          command: python scripts/check_restoration_diagnostic.py --root /tmp/pcs-restoration --campaign python --assertion valid

  check-python-contract:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - run:
          command: python scripts/check_restoration_diagnostic.py --root /tmp/pcs-restoration --campaign python --assertion contract

  check-python-determinism:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - run:
          command: python scripts/check_restoration_diagnostic.py --root /tmp/pcs-restoration --campaign python --assertion determinism

  check-python-version:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - run:
          command: python scripts/check_restoration_diagnostic.py --root /tmp/pcs-restoration --campaign python --assertion version

  check-python-native:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - run:
          command: python scripts/check_restoration_diagnostic.py --root /tmp/pcs-restoration --campaign python --assertion native

  check-python-output:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - run:
          command: python scripts/check_restoration_diagnostic.py --root /tmp/pcs-restoration --campaign python --assertion output

  check-r-valid:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - run:
          command: python scripts/check_restoration_diagnostic.py --root /tmp/pcs-restoration --campaign r --assertion valid

  check-r-contract:
    docker:
      - image: cimg/python:3.12
    steps:
