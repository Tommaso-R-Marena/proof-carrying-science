version: 2.1

commands:
  # Every restoration producer and consumer crosses an authority-gated v0.6
  # attestation/verification boundary, so Lean is part of the shared setup.
  setup-pcs:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e .
      - run:
          name: Build mandatory Lean authority
          command: |
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
            echo 'export PATH="$HOME/.elan/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            cd formal
            lake build pcs-lean-authority

jobs:
  proof-search-syntax:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Compile proof translation/search Python sources
          command: |
            python -m py_compile \
              pcs/proof_translation_v06.py \
              pcs/proof_repair_v06.py \
              pcs/proof_search_v06.py \
              pcs/decomposition_proposer_v06.py \
              pcs/artifact_inspection_v06.py \
              pcs/proof_search_corpus_v06.py \
              pcs/external_validator_v06.py \
              pcs/reference_validators/pkpd_rmse_v06.py \
              pcs/pkpd_translation_benchmark_v06.py \
              pcs/cli.py \
              scripts/run_pkpd_translation_benchmark_v06.py \
              tests/test_crypto_domains_v06.py \
              tests/test_external_validator_v06.py \
              tests/test_external_validator_attestation_v06.py \
              tests/test_proof_translation_v06.py \
              tests/test_proof_repair_v06.py \
              tests/test_proof_search_v06.py \
              tests/test_decomposition_proposer_v06.py \
              tests/test_artifact_inspection_v06.py \
              tests/test_proof_search_corpus_v06.py \
              tests/test_pkpd_translation_benchmark_v06.py \
              tests/test_pkpd_peak_threshold_v06.py

  proof-search-python-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install focused PCS test environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Run proof translation, validator, repair, search, corpus, and PK/PD tests
          command: |
            . .venv/bin/activate
            python -m pytest -q \
              tests/test_crypto_domains_v06.py \
              tests/test_external_validator_v06.py \
              tests/test_proof_translation_v06.py \
              tests/test_proof_repair_v06.py \
              tests/test_proof_search_v06.py \
              tests/test_decomposition_proposer_v06.py \
              tests/test_artifact_inspection_v06.py \
              tests/test_proof_search_corpus_v06.py \
              tests/test_pkpd_translation_benchmark_v06.py \
              tests/test_pkpd_peak_threshold_v06.py

  corpus-diag-core:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install corpus diagnostic environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Run core record diagnostics
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_proof_search_corpus_v06.py -k "default_record or content_export_requires or synthetic_training_record or tampered_session or record_and_policy_files"

  corpus-diag-policy:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install corpus diagnostic environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Run corpus policy diagnostics
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_proof_search_corpus_v06.py -k "partner_training or training_policy or corpus_is_deterministic or problem_group_split or corpus_keeps_content or corpus_writer"

  corpus-diag-interactions:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install corpus diagnostic environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Run interaction provenance diagnostics
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_proof_search_corpus_v06.py -k "decomposition_inspection_chain or wrong_or_tampered_interaction or interaction_export_requires"

  corpus-diag-cli:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install corpus diagnostic environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Run CLI round-trip diagnostic
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_proof_search_corpus_v06.py -k "record_and_corpus_cli_round_trip"

  product-demo-hardening:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install PCS test environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev,standalone]"
      - run:
          name: Build mandatory Lean authority
          command: |
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
            echo 'export PATH="$HOME/.elan/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            cd formal
            lake build pcs-lean-authority
      - run:
          name: Run P0/P1 product hardening gates
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_golden_examples_v06.py tests/test_adversarial_v06_hardening.py tests/test_local_verify_v06.py tests/test_lean_authority_v06.py tests/test_numeric_contract_v06.py tests/test_crypto_domains_v06.py tests/test_v06_crypto_schemas.py tests/test_external_validator_v06.py tests/test_external_validator_attestation_v06.py tests/test_proof_translation_v06.py tests/test_proof_repair_v06.py tests/test_proof_search_v06.py tests/test_decomposition_proposer_v06.py tests/test_artifact_inspection_v06.py tests/test_proof_search_corpus_v06.py tests/test_pkpd_translation_benchmark_v06.py tests/test_pkpd_peak_threshold_v06.py
            python scripts/run_golden_examples_v06.py -o /tmp/pcs-golden-demo
            python scripts/run_pkpd_translation_benchmark_v06.py -o /tmp/pcs-pkpd-translation-benchmark
            python scripts/adversarial_v06_hardening.py
            source "$BASH_ENV"
            python scripts/build_verifier_artifact.py -o /tmp/pcs-verifier-v06
            /tmp/pcs-verifier-v06 --help
            python scripts/smoke_standalone_verifier_v06.py /tmp/pcs-verifier-v06
      - store_artifacts:
          path: /tmp/pcs-pkpd-translation-benchmark/.pcs/pkpd-translation-benchmark/benchmark-report.json
          destination: pkpd-translation-benchmark/benchmark-report.json
      - store_artifacts:
          path: /tmp/pcs-verifier-v06
          destination: reviewer-verifier/pcs-verifier-v06
      - store_artifacts:
          path: /tmp/pcs-verifier-v06.manifest.json
          destination: reviewer-verifier/pcs-verifier-v06.manifest.json

  restoration-regression:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install test environment
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Build mandatory Lean authority
          command: |
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
            echo 'export PATH="$HOME/.elan/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            cd formal
            lake build pcs-lean-authority
      - run:
          name: Test restoration binding and semantic determinism
          command: |
            . .venv/bin/activate
            python -m pytest -q tests/test_environment_v06.py::test_vendored_python_wheels_are_signed_environment_sources tests/test_environment_v06.py::test_vendored_r_repository_payloads_are_signed_environment_sources tests/test_environment_v06.py::test_discovery_promotes_vendored_restoration_artifacts_into_manifest tests/test_environment_execute_v06.py

  produce-python-wheel:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed NumPy wheelhouse campaign
          command: |
            rm -rf /tmp/pcs-restoration
            mkdir -p /tmp/pcs-restoration
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py produce --output /tmp/pcs-restoration/python-bundle
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-bundle
      - store_artifacts:
          path: /tmp/pcs-restoration/python-bundle/campaign.json
          destination: python-wheel/producer-campaign.json

  replay-python-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed NumPy wheel and replay on amd64
          command: |
            mkdir -p /tmp/pcs-restoration/python-results
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py replay --input /tmp/pcs-restoration/python-bundle --output /tmp/pcs-restoration/python-results/amd64 --machine-id circleci-python-wheel-amd64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-results/amd64
      - store_artifacts:
          path: /tmp/pcs-restoration/python-results/amd64
          destination: python-wheel/amd64

  replay-python-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed NumPy wheel and replay on ARM64
          command: |
            mkdir -p /tmp/pcs-restoration/python-results
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py replay --input /tmp/pcs-restoration/python-bundle --output /tmp/pcs-restoration/python-results/arm64 --machine-id circleci-python-wheel-arm64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - python-results/arm64
      - store_artifacts:
          path: /tmp/pcs-restoration/python-results/arm64
          destination: python-wheel/arm64

  aggregate-python-wheel:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Assert hash-locked wheel restoration and ABI evidence
          command: |
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py aggregate --input /tmp/pcs-restoration/python-results --output /tmp/pcs-restoration/python-wheel-summary.json
            cat /tmp/pcs-restoration/python-wheel-summary.json
      - store_artifacts:
          path: /tmp/pcs-restoration/python-wheel-summary.json
          destination: python-wheel-summary.json

  produce-r-renv:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Produce signed offline renv campaign
          command: |
            mkdir -p /tmp/pcs-restoration
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py produce --output /tmp/pcs-restoration/r-bundle
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-bundle
      - store_artifacts:
          path: /tmp/pcs-restoration/r-bundle/campaign.json
          destination: r-renv/producer-campaign.json

  replay-r-renv-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed renv lock and replay on amd64
          command: |
            mkdir -p /tmp/pcs-restoration/r-results
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py replay --input /tmp/pcs-restoration/r-bundle --output /tmp/pcs-restoration/r-results/amd64 --machine-id circleci-renv-amd64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-results/amd64
      - store_artifacts:
          path: /tmp/pcs-restoration/r-results/amd64
          destination: r-renv/amd64

  replay-r-renv-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Restore signed renv lock and replay on ARM64
          command: |
            mkdir -p /tmp/pcs-restoration/r-results
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py replay --input /tmp/pcs-restoration/r-bundle --output /tmp/pcs-restoration/r-results/arm64 --machine-id circleci-renv-arm64
      - persist_to_workspace:
          root: /tmp/pcs-restoration
          paths:
            - r-results/arm64
      - store_artifacts:
          path: /tmp/pcs-restoration/r-results/arm64
          destination: r-renv/arm64

  aggregate-r-renv:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-restoration
      - setup-pcs
      - run:
          name: Assert offline renv restoration evidence
          command: |
            . .venv/bin/activate
            python scripts/r_renv_restore_campaign.py aggregate --input /tmp/pcs-restoration/r-results --output /tmp/pcs-restoration/r-renv-summary.json
            cat /tmp/pcs-restoration/r-renv-summary.json
      - store_artifacts:
          path: /tmp/pcs-restoration/r-renv-summary.json
          destination: r-renv-summary.json


  formal-wire-lean:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Lean 4 toolchain manager
          command: |
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
            echo 'export PATH="$HOME/.elan/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Build production formal root and audit trust escapes
          command: |
            source "$BASH_ENV"
            ./scripts/verify_lean.sh

  formal-v06-integration:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Python and PCS test environment
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
      - run:
          name: Install Lean 4 toolchain manager
          command: |
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
            echo 'export PATH="$HOME/.elan/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Build and audit complete v0.6/v2 formal layer
          command: |
            source "$BASH_ENV"
            ./scripts/verify_lean.sh
      - run:
          name: Run full Python suite and Lean/Python differential gates
          command: |
            source "$BASH_ENV"
            . .venv/bin/activate
            python -m pytest -q
            python -m pytest -q tests/test_formal_v2_regressions.py tests/test_formal_v2_differential.py

  restoration-boundaries-complete:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Restoration and ABI campaigns complete
          command: echo "Python hash-locked wheel restoration, native ABI variation, and offline R renv restoration all passed."

workflows:
  formal-v06-integration:
    jobs:
      - formal-v06-integration:
          filters:
            branches:
              only:
                - formal/v06-e2e-refinement
                - formal/lean-authoritative-production

  proof-search-hardening:
    jobs:
      - proof-search-syntax:
          filters: &proof_search_branches
            branches:
              only:
                - core/proof-obligation-graph-v1
                - core/proof-repair-contract-v1
                - core/proof-search-coordinator-v1
                - product/pkpd-realistic-translation-benchmark-v1
                - core/signed-external-validator-receipts-v1
                - core/pkpd-peak-threshold-checker-v1
                - core/recursive-claim-ir-v1
                - core/decompose-claim-search-action-v1
                - core/decomposition-proposer-protocol-v1
                - core/bounded-artifact-inspection-v1
                - core/proof-search-corpus-v2
      - proof-search-python-tests:
          requires: [proof-search-syntax]
          filters: *proof_search_branches
      - corpus-diag-core:
          requires: [proof-search-syntax]
          filters: *proof_search_branches
      - corpus-diag-policy:
          requires: [proof-search-syntax]
          filters: *proof_search_branches
      - corpus-diag-interactions:
          requires: [proof-search-syntax]
          filters: *proof_search_branches
      - corpus-diag-cli:
          requires: [proof-search-syntax]
          filters: *proof_search_branches

  product-demo-hardening:
    jobs:
      - product-demo-hardening:
          filters:
            branches:
              only:
                - main
                - product/p0-p1-demo-hardening
                - formal/lean-authoritative-production
                - core/proof-obligation-graph-v1
                - core/proof-repair-contract-v1
                - core/proof-search-coordinator-v1
                - product/pkpd-realistic-translation-benchmark-v1
                - core/signed-external-validator-receipts-v1
                - core/pkpd-peak-threshold-checker-v1
                - core/recursive-claim-ir-v1
                - core/decompose-claim-search-action-v1
                - core/decomposition-proposer-protocol-v1
                - core/bounded-artifact-inspection-v1
                - core/proof-search-corpus-v2

  restoration-and-abi-evidence:
    jobs:

      - formal-wire-lean:
          filters:
            branches:
              only:
                - main
                - formal/integrate-wire-v1-main
                - formal/lean-authoritative-production
      - restoration-regression:
          filters: &pcs_branch
            branches:
              only:
                - main
                - release/main-wiring
      - produce-python-wheel:
          requires: [restoration-regression]
          filters: *pcs_branch
      - replay-python-amd64:
          requires: [produce-python-wheel]
          filters: *pcs_branch
      - replay-python-arm64:
          requires: [produce-python-wheel]
          filters: *pcs_branch
      - aggregate-python-wheel:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - produce-r-renv:
          requires: [restoration-regression]
          filters: *pcs_branch
      - replay-r-renv-amd64:
          requires: [produce-r-renv]
          filters: *pcs_branch
      - replay-r-renv-arm64:
          requires: [produce-r-renv]
          filters: *pcs_branch
      - aggregate-r-renv:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - restoration-boundaries-complete:
          requires: [aggregate-python-wheel, aggregate-r-renv]
          filters: *pcs_branch
