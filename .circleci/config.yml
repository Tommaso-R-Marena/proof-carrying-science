version: 2.1

jobs:
  podman-probe:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install and exercise Podman
          command: |
            sudo apt-get update
            sudo apt-get install -y podman uidmap
            podman --version
            podman info
            podman pull docker.io/library/python:3.12-slim-bookworm
            podman run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory 512m --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m docker.io/library/python:3.12-slim-bookworm python -c 'import platform; print(platform.python_version())'

  r-image-probe:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Probe multi-arch R image
          command: |
            docker version
            docker buildx version
            docker pull r-base:latest
            docker buildx imagetools inspect r-base:latest
            docker run --rm --network=none r-base:latest Rscript --vanilla -e 'cat(as.character(getRversion()))'
            echo

workflows:
  runtime-boundary-probe:
    jobs:
      - podman-probe
      - r-image-probe
