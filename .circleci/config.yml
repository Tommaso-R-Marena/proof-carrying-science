version: 2.1

commands:
  setup-pcs:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e .

jobs:
  pypi-api:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Query NumPy PyPI release metadata
          command: |
            . .venv/bin/activate
            python scripts/probe_python_wheel_restore.py api

  pypi-x86:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Download and verify x86_64 NumPy wheel
          command: |
            . .venv/bin/activate
            python scripts/probe_python_wheel_restore.py x86

  pypi-arm:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Download and verify ARM64 NumPy wheel
          command: |
            . .venv/bin/activate
            python scripts/probe_python_wheel_restore.py arm

  wheel-resolve:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Resolve both signed wheel candidates
          command: |
            . .venv/bin/activate
            python scripts/probe_python_wheel_restore.py resolve

  wheel-offline-build:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Install hash-locked wheel offline
          command: |
            . .venv/bin/activate
            python scripts/probe_python_wheel_restore.py build

  wheel-full-producer:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-pcs
      - run:
          name: Run full PCS wheel producer
          command: |
            rm -rf /tmp/pcs-wheel-full
            . .venv/bin/activate
            python scripts/python_hash_wheel_abi_campaign.py produce               --output /tmp/pcs-wheel-full

workflows:
  python-wheel-diagnostic:
    jobs:
      - pypi-api:
          filters: &pcs_branch
            branches:
              only: v06/replay-normalized-wire-v2
      - pypi-x86:
          filters: *pcs_branch
      - pypi-arm:
          filters: *pcs_branch
      - wheel-resolve:
          requires:
            - pypi-api
            - pypi-x86
            - pypi-arm
          filters: *pcs_branch
      - wheel-offline-build:
          requires:
            - wheel-resolve
          filters: *pcs_branch
      - wheel-full-producer:
          requires:
            - wheel-offline-build
          filters: *pcs_branch
