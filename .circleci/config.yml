workflows:
  restoration-and-abi-evidence:
    jobs:
      - restoration-regression:
          filters: &pcs_branch
            branches:
              only: v06/replay-normalized-wire-v2
      - produce-python-wheel:
          requires: [restoration-regression]
          filters: *pcs_branch
      - replay-python-amd64:
          requires: [produce-python-wheel]
          filters: *pcs_branch
      - replay-python-arm64:
          requires: [produce-python-wheel]
          filters: *pcs_branch
      - aggregate-python-wheel:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-valid:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-contract:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-determinism:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-version:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-native:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-output:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - produce-r-renv:
          requires: [restoration-regression]
          filters: *pcs_branch
      - replay-r-renv-amd64:
          requires: [produce-r-renv]
          filters: *pcs_branch
      - replay-r-renv-arm64:
          requires: [produce-r-renv]
          filters: *pcs_branch
      - aggregate-r-renv:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-valid:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-contract:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-determinism:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-version:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-artifacts:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-output:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-python-det-child-valid:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-det-container-digest:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-det-dependency-tree:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-det-realized-environment:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-python-det-projection:
          requires: [replay-python-amd64, replay-python-arm64]
          filters: *pcs_branch
      - check-r-det-child-valid:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-det-container-digest:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-det-dependency-tree:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-det-realized-environment:
          requires: [replay-r-renv-amd64, replay-r-renv-arm64]
          filters: *pcs_branch
      - check-r-det-projection:
