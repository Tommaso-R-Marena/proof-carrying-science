version: 2.1

commands:
  setup-python:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip

  install-pcs:
    steps:
      - setup-python
      - run:
          name: Install PCS
          command: |
            . .venv/bin/activate
            python -m pip install -e .

jobs:
  environment-probe:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Probe CircleCI machine
          command: |
            uname -a
            cat /etc/os-release
            docker version
            docker buildx version
      - setup-python
      - run:
          name: Probe Python
          command: |
            . .venv/bin/activate
            python --version
            pip --version

  workspace-collect:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-python
      - run:
          name: Install PCS with test dependencies
          command: |
            . .venv/bin/activate
            python -m pip install -e ".[dev]"
      - run:
          name: Collect workspace tests
          command: |
            . .venv/bin/activate
            python -m pytest --collect-only -q tests/test_environment_workspace_v06.py

  workspace-bundle-fixture:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-python
      - run:
          name: Install PCS with test dependencies
          command: |
            . .venv/bin/activate
            python -m pip install -e ".[dev]"
      - run:
          name: Build workspace test bundle fixture
          command: |
            . .venv/bin/activate
            python - <<'PY'
            import importlib.util
            import tempfile
            from pathlib import Path
            spec = importlib.util.spec_from_file_location("workspace_tests", "tests/test_environment_workspace_v06.py")
            mod = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(mod)
            with tempfile.TemporaryDirectory() as d:
                bundle, public, fingerprint, project = mod._bundle(Path(d))
                assert bundle.is_file()
                assert public.is_file()
                assert fingerprint
                assert project.is_dir()
            PY

  workspace-prepare-diagnostic:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - setup-python
      - run:
          name: Install PCS with test dependencies
          command: |
            . .venv/bin/activate
            python -m pip install -e ".[dev]"
      - run:
          name: Prepare verified environment workspace
          command: |
            . .venv/bin/activate
            python - <<'PY'
            import importlib.util
            import tempfile
            from pathlib import Path
            from pcs.environment_workspace_v06 import prepare_verified_environment_workspace_v06
            spec = importlib.util.spec_from_file_location("workspace_tests", "tests/test_environment_workspace_v06.py")
            mod = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(mod)
            with tempfile.TemporaryDirectory() as d:
                root = Path(d)
                bundle, public, fingerprint, project = mod._bundle(root)
                result = prepare_verified_environment_workspace_v06(
                    bundle,
                    root / "workspace",
                    public,
                    expected_fingerprint=fingerprint,
                )
                assert result["valid"] is True
            PY

  produce-signed-campaign:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Produce signed campaign
          command: |
            rm -rf /tmp/pcs-cross-machine
            mkdir -p /tmp/pcs-cross-machine
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py produce --output /tmp/pcs-cross-machine/bundles
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - bundles

  replay-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Replay on amd64
          command: |
            uname -a
            docker version
            mkdir -p /tmp/pcs-cross-machine/results
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py replay --input /tmp/pcs-cross-machine/bundles --output /tmp/pcs-cross-machine/results/circleci-ubuntu24-amd64 --machine-id circleci-ubuntu24-amd64
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - results/circleci-ubuntu24-amd64
      - store_artifacts:
          path: /tmp/pcs-cross-machine/results/circleci-ubuntu24-amd64
          destination: circleci-ubuntu24-amd64

  replay-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Replay on arm64
          command: |
            uname -a
            docker version
            mkdir -p /tmp/pcs-cross-machine/results
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py replay --input /tmp/pcs-cross-machine/bundles --output /tmp/pcs-cross-machine/results/circleci-ubuntu24-arm64 --machine-id circleci-ubuntu24-arm64
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - results/circleci-ubuntu24-arm64
      - store_artifacts:
          path: /tmp/pcs-cross-machine/results/circleci-ubuntu24-arm64
          destination: circleci-ubuntu24-arm64

  aggregate-evidence:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Assert cross-machine evidence
          command: |
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py aggregate --input /tmp/pcs-cross-machine/results --output /tmp/pcs-cross-machine/circleci-cross-machine-summary.json
            cat /tmp/pcs-cross-machine/circleci-cross-machine-summary.json
      - store_artifacts:
          path: /tmp/pcs-cross-machine/circleci-cross-machine-summary.json
          destination: circleci-cross-machine-summary.json

workflows:
  pcs-cross-machine-oci:
    jobs:
      - environment-probe:
          filters: &pcs_branch
            branches:
              only: v06/replay-normalized-wire-v2
      - workspace-collect:
          requires:
            - environment-probe
          filters: *pcs_branch
      - workspace-bundle-fixture:
          requires:
            - workspace-collect
          filters: *pcs_branch
      - workspace-prepare-diagnostic:
          requires:
            - workspace-bundle-fixture
          filters: *pcs_branch
      - produce-signed-campaign:
          requires:
            - workspace-prepare-diagnostic
          filters: *pcs_branch
      - replay-amd64:
          requires:
            - produce-signed-campaign
          filters: *pcs_branch
      - replay-arm64:
          requires:
            - produce-signed-campaign
          filters: *pcs_branch
      - aggregate-evidence:
          requires:
            - replay-amd64
            - replay-arm64
          filters: *pcs_branch
