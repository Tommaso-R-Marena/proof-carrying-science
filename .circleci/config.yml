version: 2.1

# PCS compute CI has moved to Cloudflare Workers Builds so verification does not
# depend on exhausted hosted-runner credits. Keep the CircleCI VCS integration
# alive with a zero-credit no-op only; substantive assurance runs in the
# Cloudflare "pcs-core-ci-gate" / "pcs-core-ci-only" builds.
#
# IMPORTANT: GitHub's legacy required status "ci/circleci: repository-integrity"
# must not be used as an authority gate after this migration. The protected-main
# ruleset should require the Cloudflare check run instead.

jobs:
  legacy-ci-disabled:
    type: no-op

workflows:
  pcs-zero-credit-transition:
    jobs:
      - legacy-ci-disabled
