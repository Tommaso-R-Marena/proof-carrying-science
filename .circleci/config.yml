version: 2.1

commands:
  setup-python:
    steps:
      - run:
          name: Install Python tooling
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip

  install-pcs:
    steps:
      - setup-python
      - run:
          name: Install PCS
          command: |
            . .venv/bin/activate
            python -m pip install -e .

jobs:
  environment-probe:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Probe CircleCI machine
          command: |
            uname -a
            cat /etc/os-release
            docker version
            docker buildx version
      - setup-python
      - run:
          name: Probe Python
          command: |
            . .venv/bin/activate
            python --version
            pip --version

  workspace-import:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic import
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py import

  workspace-scaffold:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic scaffold
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py scaffold

  workspace-discover:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic discover
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py discover

  workspace-confirm:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic confirm
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py confirm

  workspace-attest:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic attest
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py attest

  workspace-verify:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic verify
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py verify

  workspace-load:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic load
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py load

  workspace-environment:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic environment
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py environment

  workspace-replay-plan:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic replay-plan
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py replay-plan

  workspace-sandbox-plan:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic sandbox-plan
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py sandbox-plan

  workspace-prepare:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Workspace diagnostic prepare
          command: |
            . .venv/bin/activate
            python scripts/diagnose_workspace_v06.py prepare

  produce-signed-campaign:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - install-pcs
      - run:
          name: Produce signed campaign
          command: |
            rm -rf /tmp/pcs-cross-machine
            mkdir -p /tmp/pcs-cross-machine
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py produce --output /tmp/pcs-cross-machine/bundles
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - bundles

  replay-amd64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Replay on amd64
          command: |
            uname -a
            docker version
            mkdir -p /tmp/pcs-cross-machine/results
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py replay --input /tmp/pcs-cross-machine/bundles --output /tmp/pcs-cross-machine/results/circleci-ubuntu24-amd64 --machine-id circleci-ubuntu24-amd64
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - results/circleci-ubuntu24-amd64
      - store_artifacts:
          path: /tmp/pcs-cross-machine/results/circleci-ubuntu24-amd64
          destination: circleci-ubuntu24-amd64

  replay-arm64:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Replay on arm64
          command: |
            uname -a
            docker version
            mkdir -p /tmp/pcs-cross-machine/results
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py replay --input /tmp/pcs-cross-machine/bundles --output /tmp/pcs-cross-machine/results/circleci-ubuntu24-arm64 --machine-id circleci-ubuntu24-arm64
      - persist_to_workspace:
          root: /tmp/pcs-cross-machine
          paths:
            - results/circleci-ubuntu24-arm64
      - store_artifacts:
          path: /tmp/pcs-cross-machine/results/circleci-ubuntu24-arm64
          destination: circleci-ubuntu24-arm64

  aggregate-evidence:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/pcs-cross-machine
      - install-pcs
      - run:
          name: Assert cross-machine evidence
          command: |
            . .venv/bin/activate
            python scripts/cross_machine_oci_campaign.py aggregate --input /tmp/pcs-cross-machine/results --output /tmp/pcs-cross-machine/circleci-cross-machine-summary.json
            cat /tmp/pcs-cross-machine/circleci-cross-machine-summary.json
      - store_artifacts:
          path: /tmp/pcs-cross-machine/circleci-cross-machine-summary.json
          destination: circleci-cross-machine-summary.json

workflows:
  pcs-cross-machine-oci:
    jobs:
      - environment-probe:
          filters: &pcs_branch
            branches:
              only: v06/replay-normalized-wire-v2
      - workspace-import:
          requires:
            - environment-probe
          filters: *pcs_branch
      - workspace-scaffold:
          requires:
            - workspace-import
          filters: *pcs_branch
      - workspace-discover:
          requires:
            - workspace-scaffold
          filters: *pcs_branch
      - workspace-confirm:
          requires:
            - workspace-discover
          filters: *pcs_branch
      - workspace-attest:
          requires:
            - workspace-confirm
          filters: *pcs_branch
      - workspace-verify:
          requires:
            - workspace-attest
          filters: *pcs_branch
      - workspace-load:
          requires:
            - workspace-verify
          filters: *pcs_branch
      - workspace-environment:
          requires:
            - workspace-load
          filters: *pcs_branch
      - workspace-replay-plan:
          requires:
            - workspace-environment
          filters: *pcs_branch
      - workspace-sandbox-plan:
          requires:
            - workspace-replay-plan
          filters: *pcs_branch
      - workspace-prepare:
          requires:
            - workspace-sandbox-plan
          filters: *pcs_branch
      - produce-signed-campaign:
          requires:
            - workspace-prepare
          filters: *pcs_branch
      - replay-amd64:
          requires:
            - produce-signed-campaign
          filters: *pcs_branch
      - replay-arm64:
          requires:
            - produce-signed-campaign
          filters: *pcs_branch
      - aggregate-evidence:
          requires:
            - replay-amd64
            - replay-arm64
          filters: *pcs_branch
