# PROPOSED, NOT APPLIED (owner decision G1, website).  To take effect it must be committed to the
# site's protected `main` (pull_request_target runs only the copy on the default branch) and
# `gate-definition-unchanged` added as a required check.  See REQUIRED_CHECKS.md, "G1".
#
# It runs the definition on `main`, never the pull request's.  It reads the pull request's commits as
# data (git diff of file names) and executes nothing from them; the token is read-only and no
# secret is used.  It fails when the pull request changes any workflow or a file that defines the
# retained-source gate, so such a change can merge only through the owner's recorded ruleset bypass.
name: Gate definition guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gate-definition-unchanged:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the gate-defining files of the pull request with its base (read as data, never executed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "${HEAD_SHA}"
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- \
            .github/workflows scripts/check_reconciled_prs.py scripts/test_reconciled_prs.py docs/reconciliation/OPEN_PRS.json)"
          if [ -n "${changed}" ]; then
            printf 'This pull request changes files that define the required gates:\n%s\n' "${changed}"
            printf 'Such a change needs a separate owner decision and the owner'"'"'s recorded ruleset bypass.\n'
            exit 1
          fi
          echo "No workflow and no gate-defining file changed."
