[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-carrying-science"
version = "0.5.0"
description = "Independently verifiable assurance artifacts for critical computational science"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "jsonschema>=4.23"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest>=8"]\nstandalone = ["pyinstaller>=6.11"]

[project.scripts]
pcs = "pcs.cli:main"\npcs-verifier-v06 = "pcs.verifier_entrypoint:main"

[tool.setuptools.packages.find]
include = ["pcs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
"pcs.schemas" = ["*.json"]
