name = "ClaimCheckFormal"
defaultTargets = ["ClaimCheck"]

# Core-only reference checker (no dependencies).  Per-claim obligations concatenate this file.
[[lean_lib]]
name = "ClaimCheck"
roots = ["ClaimCheck"]

# Mathlib-based meaning theorems about the checker's definitions (proof-only; never needed to
# check or replay a claim).
[[lean_lib]]
name = "ClaimCheckReal"
srcDir = "real"
roots = ["ClaimCheckReal"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"
