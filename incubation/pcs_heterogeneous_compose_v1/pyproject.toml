[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcs-heck"
version = "0.1.0"
description = "Heterogeneous Evidence Composition Kernel (PCS incubation)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
heck = "heck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["heck*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
