[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcs-next-v1"
version = "0.1.0"
description = "Isolated PCS Next integrated scientific-assurance candidate (non-production)"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "jsonschema>=4.23"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcs-next = "pcs_next_v1.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcs_next_v1*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
