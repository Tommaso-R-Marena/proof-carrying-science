[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcs-epistemic-calculus-v1"
version = "0.1.0"
description = "Incubation: proof-carrying epistemic calculus (composition, invalidation, dialectic)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tommaso R. Marena" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pcs-epistemic = "pcs_epistemic.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
