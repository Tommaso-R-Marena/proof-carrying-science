[package]
name = "pcs_independent_jcs"
version = "0.1.0"
edition = "2021"
description = "Independent RFC 8785 / PCS JCS reference checker (not the production verifier)"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
sha2 = "=0.10.8"
clap = { version = "=4.5.23", features = ["derive"] }
hex = "=0.4.3"
thiserror = "=1.0.69"

[[bin]]
name = "pcs-independent-jcs"
path = "src/main.rs"
