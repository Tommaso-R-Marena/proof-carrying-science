name: PCS Real LLM Tool Firewall
on:
  pull_request:
    paths:
      - 'research/llm_firewall_v1/**'
      - 'research/trace_lab_v1/audit.py'
      - 'pcs/jsonio.py'
      - 'pcs/transport_kernel_v1.py'
      - 'pcs/action_shield_v1.py'
      - 'formal/PCSActionShield.lean'
      - 'tests/test_action_shield_v1.py'
      - 'scripts/activate_lean_428.sh'
      - 'scripts/audit_lean_source.py'
      - 'requirements-build.lock'
      - 'requirements-dev.lock'
      - '.github/workflows/pcs-llm-firewall-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-enforcement-and-model-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install pinned Std-only proof tools and Python dependencies
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Require real compiler, hostile broker tests and offline model capture replay
        env:
          PCS_REQUIRE_LLM_FIXTURE: '1'
          PCS_LLM_REPLAY_EVIDENCE: ${{ runner.temp }}/llm-replay
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m research.llm_firewall_v1.preservation > "$RUNNER_TEMP/llm-preservation.json"
          python -m research.integration_v1.source_gate > "$RUNNER_TEMP/llm-source-gate.json"
          python scripts/audit_lean_source.py research/llm_firewall_v1/Policy.lean research/llm_firewall_v1/Main.lean > "$RUNNER_TEMP/llm-new-source-audit.log"
          python -m pytest -q research/llm_firewall_v1/test_firewall.py tests/test_action_shield_v1.py --junitxml="$RUNNER_TEMP/llm-tests.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: real-llm-firewall-independent-replay
          path: |
            ${{ runner.temp }}/llm-replay
            ${{ runner.temp }}/llm-preservation.json
            ${{ runner.temp }}/llm-source-gate.json
            ${{ runner.temp }}/llm-new-source-audit.log
            ${{ runner.temp }}/llm-tests.xml
          retention-days: 14
