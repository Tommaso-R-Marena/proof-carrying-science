name: PCS Authorization History Research
on:
  pull_request:
    branches: ['integration/pcs-all-open-prs-synthesis-20261018-sol-high']
    paths:
      - 'research/authorization_history_v1/**'
      - 'docs/research/post-integration-2026-10-18/authorization-history.md'
      - 'research/integration_v1/prepare_mathlib_cache.py'
      - 'scripts/audit_lean_source.py'
      - 'scripts/activate_lean_428.sh'
      - 'lake-manifest.json'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'requirements-dev.lock'
      - '.github/workflows/pcs-authorization-history-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcs-auth-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-history:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Real signatures, crash/CAS tests, hostile-store budgets and pin failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auth-history-reports"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m unittest research.authorization_history_v1.test_history research.authorization_history_v1.test_resources research.authorization_history_v1.test_formal_inputs -v 2>&1 | tee "$RUNNER_TEMP/auth-history-reports/runtime.txt"
      - name: Pinned dependency inputs, standalone Lake build and all theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/auth-history-reports/dependency-cache.txt"
          python -m research.integration_v1.prepare_mathlib_cache --project research/authorization_history_v1/formal 2>&1 | tee "$RUNNER_TEMP/auth-history-reports/dependency-inputs.txt"
          python research/authorization_history_v1/check_formal.py --lean "$(command -v lean)" --cache-root "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/auth-history-reports/formal.txt"
          (cd research/authorization_history_v1/formal && lake build) 2>&1 | tee "$RUNNER_TEMP/auth-history-reports/lake-build.txt"
          git diff --exit-code -- research/authorization_history_v1/formal/lake-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: authorization-history-research
          path: ${{ runner.temp }}/auth-history-reports
          if-no-files-found: error
