name: PCS Pointwise Dominance Research
on:
  pull_request:
    paths:
      - 'research/proof-gated-self-improvement-v1/**'
      - 'formal/PCS/V2/ProofGated*.lean'
      - 'formal/lean-toolchain'
      - 'scripts/activate_lean_428.sh'
      - '.github/workflows/pcs-pointwise-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pointwise-certificates:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Real kernel tests and preserved historical evidence
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          evidence="$RUNNER_TEMP/pgsi-pointwise-evidence"
          mkdir "$evidence"
          cd research/proof-gated-self-improvement-v1
          python -m unittest discover -s pointwise/tests -v 2>&1 | tee "$evidence/tests.log"
          python check_hardening_evidence.py | tee "$evidence/parent-evidence.json"
          python kernel/verify_results.py --folder kernel/results/v1 | tee "$evidence/kernel-historical-evidence.json"
      - name: Exhaustive whole-domain decisions, counterexamples and search graph
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          evidence="$RUNNER_TEMP/pgsi-pointwise-evidence"
          campaign="$RUNNER_TEMP/pgsi-pointwise-campaign"
          cd research/proof-gated-self-improvement-v1
          python pointwise/campaign.py --output "$campaign" | tee "$evidence/campaign.log"
          python pointwise/verify_results.py --folder "$campaign" --expected pointwise/results/v1/RESULTS.json | tee "$evidence/qualification.json"
          mkdir "$evidence/campaign"
          cp "$campaign/"*.json "$campaign/"*.gz "$campaign/"*.log "$evidence/campaign/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pcs-pointwise-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgsi-pointwise-evidence
          if-no-files-found: error
          retention-days: 14
