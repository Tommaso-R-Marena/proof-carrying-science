name: PCS Truth Channels and Relational Release
on:
  pull_request:
    paths:
      - 'research/relational_release_v1/**'
      - '.github/workflows/pcs-relational-release-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-channels-and-release-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install pinned proof tools
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Exact claims, channels, hostile storage and independent replay
        env:
          PCS_REQUIRE_RELATIONAL_FIXTURE: '1'
          PCS_RELATIONAL_REPLAY_EVIDENCE: ${{ runner.temp }}/relational-formal/replay
          PCS_RELATIONAL_FRESH_REPLAY_EVIDENCE: ${{ runner.temp }}/relational-formal/fresh-replay
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          mkdir -p "$RUNNER_TEMP/relational-formal"
          python -m research.relational_release_v1.preservation > "$RUNNER_TEMP/relational-formal/preservation.json"
          python -m research.integration_v1.source_gate > "$RUNNER_TEMP/relational-formal/source-gate.json"
          python scripts/audit_lean_source.py research/relational_release_v1/Release.lean research/relational_release_v1/Main.lean > "$RUNNER_TEMP/relational-formal/source-audit.log"
          python -m pytest -q research/relational_release_v1/test_release.py research/relational_release_v1/followup/test_followup.py tests/test_action_shield_v1.py --junitxml="$RUNNER_TEMP/relational-formal/tests.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: relational-formal-and-replay
          path: ${{ runner.temp }}/relational-formal
          retention-days: 14
  actual-weight-disclosure-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install pinned tools
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Download real official weights and pinned native engine
        run: python -m research.local_weights_v1 download "$RUNNER_TEMP/local-weights"
      - name: Fresh actual neural disclosure campaign
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m research.relational_release_v1 evaluate "$RUNNER_TEMP/local-weights" "$RUNNER_TEMP/relational-neural"
          python -m research.relational_release_v1.followup evaluate "$RUNNER_TEMP/local-weights" "$RUNNER_TEMP/relational-neural/fresh-pairs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: relational-real-weight-campaign
          path: ${{ runner.temp }}/relational-neural
          retention-days: 14
