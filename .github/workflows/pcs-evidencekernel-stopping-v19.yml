name: PCS EvidenceKernel v19 stopping-time research
on:
  pull_request:
    paths:
      - 'research/evidencekernel_stopping_v19/**'
      - '.github/workflows/pcs-evidencekernel-stopping-v19.yml'
      - 'research/evidencekernel_selective_v17/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-stopping-inference:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exhaustive finite-model and cross-language tests
        run: python -m unittest discover -s research/evidencekernel_stopping_v19 -v -p 'test_*.py'
      - name: Independent committed example replay
        shell: bash
        run: |
          set -euo pipefail
          dir=research/evidencekernel_stopping_v19
          pin="$(cat "$dir/example_pin.txt")"
          apin="$(cat "$dir/example_attempts_pin.txt")"
          python -m research.evidencekernel_stopping_v19.kernel "$dir/example_protocol.json" "$dir/example_evidence.json" --protocol-pin "$pin" --attempts-pin "$apin" > "$RUNNER_TEMP/v19-python.json"
          node "$dir/independent.js" "$dir/example_protocol.json" "$dir/example_evidence.json" "$pin" "$apin" > "$RUNNER_TEMP/v19-node.json"
          python - "$RUNNER_TEMP/v19-python.json" "$RUNNER_TEMP/v19-node.json" "$dir/example_report.json" <<'PY'
          import json,sys
          a,b,c=[json.load(open(path)) for path in sys.argv[1:]]
          assert a==b==c
          assert a['conditional_p']=='325/10368'
          assert a['rejected_prefix_rank']=='5'
          assert a['rejected_prefix_mass']=='64'
          PY
