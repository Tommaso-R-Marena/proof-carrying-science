name: PCS EvidenceKernel v21 finite-state research
on:
  pull_request:
    paths:
      - 'research/evidencekernel_fsm_v21/**'
      - '.github/workflows/pcs-evidencekernel-fsm-v21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Exhaustive conditional probability checks
        run: python -m unittest discover -s research/evidencekernel_fsm_v21 -v -p 'test_*.py'
