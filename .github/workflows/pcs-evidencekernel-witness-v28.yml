name: PCS EvidenceKernel v28 independently witnessed allocation research
on:
  pull_request:
    paths:
      - 'research/evidencekernel_witness_v28/**'
      - '.github/workflows/pcs-evidencekernel-witness-v28.yml'
      - 'research/evidencekernel_propensity_v25/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-commit-reveal-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact supported Ed25519 provider
        run: python -m pip install cryptography==46.0.4
      - name: Reproduce deliberately untrusted synthetic ceremony fixtures
        run: python -m research.evidencekernel_witness_v28.make_demo
      - name: Exhaustive XOR fairness, tampering attacks, independent replay
        run: python -m unittest discover -s research/evidencekernel_witness_v28 -t . -v
      - name: Independent witness-and-scientific report equality (synthetic fixtures)
        shell: bash
        run: |
          set -euo pipefail
          D=research/evidencekernel_witness_v28
          CP=$(cat "$D/example_contract_pin.txt")
          SP=$(cat "$D/example_study_pin.txt")
          EP=$(cat "$D/example_evidence_pin.txt")
          python -m research.evidencekernel_witness_v28.kernel \
            "$D/example_ceremony_contract.json" "$D/example_study_protocol.json" "$D/example_witness_evidence.json" \
            --contract-pin "$CP" --study-pin "$SP" --evidence-pin "$EP" > "$RUNNER_TEMP/ekv28-py.json"
          node "$D/independent.js" \
            "$D/example_ceremony_contract.json" "$D/example_study_protocol.json" "$D/example_witness_evidence.json" \
            "$CP" "$SP" "$EP" > "$RUNNER_TEMP/ekv28-node.json"
          python - "$RUNNER_TEMP/ekv28-py.json" "$RUNNER_TEMP/ekv28-node.json" <<'PY'
          import json,sys
          a,b=[json.load(open(x)) for x in sys.argv[1:]]
          assert a == b
          assert a['verified_signed_draws'] == 256
          assert a['conditional_lower_ate'] == '83/128'
          print('Independent exact signed replay agrees')
          PY
