name: PCS v0.6 normalized-set production gate

on:
  push:
    branches:
      - v06/replay-normalized-wire-v2
  pull_request:
    branches:
      - v06/typed-certificate-internals
    paths:
      - 'pcs/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/v06-normalized-set.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gate:
    if: ${{ vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, pcs-lean-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PCS and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run frozen v0.6 production gate
        run: python scripts/run_v06_contract_gate.py

      - name: Upload immutable gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs-v06-normalized-set-production-gate
          path: results/v06-contract-runs/
          if-no-files-found: warn
          retention-days: 30
