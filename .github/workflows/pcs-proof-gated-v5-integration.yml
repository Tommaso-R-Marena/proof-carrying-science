name: PCS Aristotle V5 Strong-Gate Integration (Research Only)
on:
  pull_request:
    paths:
      - 'formal/PCS/V2/ProofGated*.lean'
      - 'formal/scripts/proof_gated_*'
      - 'formal/scripts/gen_full_audit.sh'
      - 'formal/fixtures/proof_gated/**'
      - 'research/proof-gated-self-improvement-v1/v5_fixture_differential.py'
      - '.github/workflows/pcs-proof-gated-v5-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Standalone independent PGSI1 and strong-gate fixture checks
        run: |
          set -euo pipefail
          python research/proof-gated-self-improvement-v1/v5_fixture_differential.py
      - name: Lean full V5 build, theorem axiom audit, and artifact authority tests
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          cd formal
          chmod +x scripts/proof_gated_ci.sh scripts/gen_full_audit.sh
          bash scripts/proof_gated_ci.sh
      - name: Existing Python references and adversarial regressions
        run: |
          set -euo pipefail
          cd research/proof-gated-self-improvement-v1
          python -m unittest discover -s tests -v
          python global_falsification.py
      - name: End-to-end live artifact authority and sealed loader
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          cd research/proof-gated-self-improvement-v1
          python - <<'PYLIVE'
          import tempfile
          from pathlib import Path
          from proof_gate import Model, wire_bytes
          from promotion_v2 import ResearchPromotionStore, StaleHead, ProposalRejected
          from sealed_inference import load_sealed
          with tempfile.TemporaryDirectory() as d:
              store=ResearchPromotionStore.initialize(Path(d)/'store',Path('../../formal').resolve(),Model(True,0,0))
              h0=store.audit()
              h1=store.promote(wire_bytes(Model(True,1,1)),h0)
              try:
                  store.promote(wire_bytes(Model(True,2,1)),h0)
                  raise AssertionError('stale proposal accepted')
              except StaleHead:pass
              try:
                  store.promote(wire_bytes(Model(True,0,0)),h1)
                  raise AssertionError('regression accepted')
              except ProposalRejected:pass
              h2=store.promote(wire_bytes(Model(True,2,1)),h1)
              model=load_sealed(store,expected=h2)
              assert model.artifact==wire_bytes(Model(True,2,1))
              for x in range(-32,33):
                  assert model.predict(x)==max(0,2*x+1)
              print('PASS: V5 PGSI1 authority accepts live model files and sealed runtime uses exact bytes')
          PYLIVE
