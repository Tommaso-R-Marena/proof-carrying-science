name: PCS PGSC6 Actual Lean Certificate Cross-Check
on:
  pull_request:
    paths:
      - 'research/proof-gated-self-improvement-v1/pgsc6_*'
      - 'research/proof-gated-self-improvement-v1/pgsi2_wide_runtime.py'
      - 'research/proof-gated-self-improvement-v1/tests/test_pgsc6_reference.py'
      - 'research/proof-gated-self-improvement-v1/tests/test_pgsi2_wide_runtime.py'
      - 'formal/PCS/V2/ProofGatedCertCodec.lean'
      - 'formal/PCS/V2/ProofGatedCertificate.lean'
      - '.github/workflows/pcs-pgsc6-actual-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-v6-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Kernel-check V6 PGSC6 source and complete V5/V6 theorem audit
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          cd formal
          bash scripts/proof_gated_ci.sh
      - name: Independent Python reference regression suite
        run: |
          set -euo pipefail
          cd research/proof-gated-self-improvement-v1
          python -m unittest discover -s tests -v
      - name: Actual Lean V6 PGSC6 bytes versus independently pinned Python policy
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python research/proof-gated-self-improvement-v1/pgsc6_lean_differential.py
