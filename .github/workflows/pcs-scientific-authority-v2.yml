name: PCS Scientific Authority V2
on:
  pull_request:
    paths:
      - 'research/scientific_authority_v2/**'
      - 'research/scientific_history_v2/**'
      - 'research/scientific_witness_v1/**'
      - 'docs/research/scientific-authority-v2/**'
      - 'research/scientific_receiver_v1/**'
      - 'research/authorization_history_v1/**'
      - 'research/scientific_history_v1/**'
      - 'formal/**'
      - 'lake-manifest.json'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'requirements*.lock'
      - 'scripts/activate_lean_428.sh'
      - '.github/workflows/pcs-scientific-authority-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcs-authority-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  witnessed-scientific-research:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Preserve all predecessor files and build the new kernel proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authority-v2"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m research.scientific_authority_v2.preservation > "$RUNNER_TEMP/authority-v2/preservation.json"
          source scripts/activate_lean_428.sh
          lake exe cache get
          for project in \
            incubation/pcs_certified_numerics_v1 \
            incubation/pcs_conservation_algebra_v1 \
            research/integration_v1/formal \
            research/scientific_receiver_v1/formal \
            research/authorization_history_v1/formal \
            research/scientific_history_v1/formal \
            research/scientific_authority_v2/formal; do
            python -m research.integration_v1.prepare_mathlib_cache --project "$project"
          done
          python research/scientific_authority_v2/check_formal.py --lean "$(command -v lean)"
          python -m research.scientific_receiver_v1.qualify --out "$RUNNER_TEMP/authority-v2/receiver-qualification"
      - name: Actual receiver, history, witness, crash and adversarial regression tests
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          export LEAN_PATH="$(lake -d research/scientific_receiver_v1/formal env printenv LEAN_PATH)"
          export PCS_SCIENTIFIC_LEAN="$(command -v lean)"
          export PCS_SCIENTIFIC_MAIN="$PWD/research/scientific_receiver_v1/formal/Main.lean"
          export PCS_SCIENTIFIC_CWD="$PWD/research/scientific_receiver_v1/formal"
          python -m pytest -q \
            research/scientific_receiver_v1/tests \
            research/authorization_history_v1/test_history.py \
            research/authorization_history_v1/test_resources.py \
            research/authorization_history_v1/test_formal_inputs.py \
            research/scientific_history_v1/test_receiver.py \
            research/scientific_history_v2/tests \
            research/scientific_witness_v1 \
            research/scientific_authority_v2/tests \
            --junitxml="$RUNNER_TEMP/authority-v2/tests.xml"
      - name: Complete inventoried profile and separate-process scientific reproduction
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          QUALIFICATION_SHA="$(sha256sum "$RUNNER_TEMP/authority-v2/receiver-qualification/qualification.json" | cut -d ' ' -f 1)"
          python -m research.scientific_authority_v2.bootstrap \
            --qualification "$RUNNER_TEMP/authority-v2/receiver-qualification" \
            --qualification-sha256 "$QUALIFICATION_SHA" \
            --out "$RUNNER_TEMP/authority-v2/operator-config.json"
          python -m research.scientific_authority_v2.demo \
            --config "$RUNNER_TEMP/authority-v2/operator-config.json" \
            --out "$RUNNER_TEMP/authority-v2/demo"
          python -m research.integration_v1.source_gate > "$RUNNER_TEMP/authority-v2/source-gate.json"
          python scripts/check_repository_integrity.py > "$RUNNER_TEMP/authority-v2/repository-integrity.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: scientific-authority-v2-evidence
          path: |
            ${{ runner.temp }}/authority-v2
            research/scientific_authority_v2/formal/.lake/build/lib/lean/formal-report.json
            research/scientific_authority_v2/formal/.lake/build/lib/lean/statements-and-axioms.log
