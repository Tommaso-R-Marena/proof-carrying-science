name: PCS submission verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'contributions/pcs-submissions/**'
permissions:
  contents: read
jobs:
  verify:
    name: PCS Submission Verification
    # No hosted minutes, and never run fork PR code on a personal machine.
    if: ${{ github.event.repository.private == true && github.ref_protected == true && github.event_name != 'pull_request' && vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, pcs-lean-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Validate exact submission manifest and digest bindings
        run: python scripts/check_contribution_bundle.py
      - name: Check Python contribution syntax without executing submissions
        run: |
          find contributions/pcs-submissions -type f -name '*.py' -print0 | xargs -0 -r -n1 python -m py_compile
      - name: Install isolated PCS test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build formal PCS kernel
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: formal
          build: true
          test: false
      - name: Run PCS tests on unchanged production package plus proposed artifacts
        run: python -m pytest -q
      - name: Check contributed Lean files against PCS imports
        run: |
          cd formal
          find ../contributions/pcs-submissions -type f -name '*.lean' -print0 | while IFS= read -r -d '' file; do
            lake env lean "$file"
          done
      - name: Report exact limits
        run: |
          echo 'Checks: manifest SHA-256, allowed paths, Python syntax, core PCS regression tests, Lean build and Lean contribution elaboration.'
          echo 'Passing does NOT establish real-world scientific truth or independently validate a research claim.'
