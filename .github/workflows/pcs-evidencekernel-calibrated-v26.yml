name: PCS EvidenceKernel v26 calibrated propensity research
on:
  pull_request:
    paths:
      - 'research/evidencekernel_calibrated_v26/**'
      - 'research/evidencekernel_propensity_v25/**'
      - '.github/workflows/pcs-evidencekernel-calibrated-v26.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-propensity-calibration:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact fixed-size and optionally stopped calibration, attacks, independent differential checks
        run: python -m unittest discover -s research/evidencekernel_calibrated_v26 -p 'test_*.py' -v
      - name: Compare full source-pinned audit under Python and Node
        shell: bash
        run: |
          set -euo pipefail
          D=research/evidencekernel_calibrated_v26
          CP="$(cat "$D/calibration_contract_pin.txt")"
          RP="$(cat "$D/calibration_records_pin.txt")"
          SP="$(cat "$D/study_protocol_pin.txt")"
          EP="$(cat "$D/study_records_pin.txt")"
          python -m research.evidencekernel_calibrated_v26.kernel \
            "$D/calibration_contract.json" "$D/calibration_records.json" \
            "$D/study_protocol.json" "$D/study_records.json" \
            --calibration-contract-pin "$CP" --calibration-records-pin "$RP" \
            --study-protocol-pin "$SP" --study-records-pin "$EP" > "$RUNNER_TEMP/v26-python.json"
          node "$D/independent.js" \
            "$D/calibration_contract.json" "$D/calibration_records.json" \
            "$D/study_protocol.json" "$D/study_records.json" \
            "$CP" "$RP" "$SP" "$EP" > "$RUNNER_TEMP/v26-node.json"
          python - "$RUNNER_TEMP/v26-python.json" "$RUNNER_TEMP/v26-node.json" "$D/example_report.json" <<'PY'
          import json,sys
          a,b,c=[json.load(open(f)) for f in sys.argv[1:]]
          assert a==b==c
          assert a['joint_failure_bound_if_all_physical_assumptions_hold']=='7/100'
          assert a['calibration']['propensity_ceiling_by_state']==['167/250','481/1000','267/500']
          PY
