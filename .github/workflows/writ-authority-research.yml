name: Writ authority research proof check
on:
  push:
    branches:
      - research/writ9-compositional-authority-20261109
  pull_request:
    paths:
      - 'research/writ_authority_v9/**'
      - '.github/workflows/writ-authority-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-and-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install version-pinned research Ed25519 dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Execute independent Python reference checker
        run: |
          python -m unittest -v research.writ_authority_v9.test_core research.writ_authority_v9.test_trace research.writ_authority_v9.test_witness research.writ_authority_v9.test_source_witness research.writ_authority_v9.test_effect_model research.writ_authority_v9.test_destination_reference research.writ_authority_v9.test_retention_reference research.writ_authority_v9.test_receiver_readback_v16
          python -m research.writ_authority_v9.verify_bounds
      - name: Install hash-pinned Lean 4.28.0
        shell: bash
        run: source scripts/activate_lean_428.sh
      - name: Kernel-check exact abstract authority theorems
        shell: bash
        run: |
          lean --version
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|implemented_by)([[:space:]]|$)' research/writ_authority_v9/formal/Authority.lean research/writ_authority_v9/formal/Witness.lean research/writ_authority_v9/formal/TraceExample.lean research/writ_authority_v9/formal/SyntheticGatewayReceipt.lean research/writ_authority_v9/formal/Provenance.lean research/writ_authority_v9/formal/ProvenanceExample.lean research/writ_authority_v9/formal/DualBoundary.lean research/writ_authority_v9/formal/GeneratedProvenanceReceipt.lean research/writ_authority_v9/formal/AnchoredExecution.lean research/writ_authority_v9/formal/SignedGatewayReceipt.lean research/writ_authority_v9/formal/EffectLifecycle.lean research/writ_authority_v9/formal/TripleSafety.lean research/writ_authority_v9/formal/SignedEffectReceipt.lean research/writ_authority_v9/formal/DestinationAttestation.lean research/writ_authority_v9/formal/AttestedProduct.lean research/writ_authority_v9/formal/DestinationReceiptExample.lean research/writ_authority_v9/formal/LiveRetention.lean research/writ_authority_v9/formal/LiveRetentionExample.lean; then
            echo "Forbidden proof escape hatch detected" >&2
            exit 1
          fi
          lean -o "$RUNNER_TEMP/Authority.olean" research/writ_authority_v9/formal/Authority.lean
          lean research/writ_authority_v9/formal/Witness.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/TraceExample.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/SyntheticGatewayReceipt.lean
          lean -o "$RUNNER_TEMP/Provenance.olean" research/writ_authority_v9/formal/Provenance.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/ProvenanceExample.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/DualBoundary.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/GeneratedProvenanceReceipt.lean
          LEAN_PATH="$RUNNER_TEMP" lean -o "$RUNNER_TEMP/AnchoredExecution.olean" research/writ_authority_v9/formal/AnchoredExecution.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/SignedGatewayReceipt.lean
          lean -o "$RUNNER_TEMP/EffectLifecycle.olean" research/writ_authority_v9/formal/EffectLifecycle.lean
          LEAN_PATH="$RUNNER_TEMP" lean -o "$RUNNER_TEMP/TripleSafety.olean" research/writ_authority_v9/formal/TripleSafety.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/SignedEffectReceipt.lean
          lean -o "$RUNNER_TEMP/DestinationAttestation.olean" research/writ_authority_v9/formal/DestinationAttestation.lean
          LEAN_PATH="$RUNNER_TEMP" lean -o "$RUNNER_TEMP/AttestedProduct.olean" research/writ_authority_v9/formal/AttestedProduct.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/DestinationReceiptExample.lean
          LEAN_PATH="$RUNNER_TEMP" lean -o "$RUNNER_TEMP/LiveRetention.olean" research/writ_authority_v9/formal/LiveRetention.lean
          LEAN_PATH="$RUNNER_TEMP" lean research/writ_authority_v9/formal/LiveRetentionExample.lean
