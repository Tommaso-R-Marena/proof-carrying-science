name: PCS Trace Error Envelopes
on:
  pull_request:
    paths:
      - 'research/trace_envelope_v1/**'
      - 'research/portable_transport_v2/RawDecide.lean'
      - 'research/portable_transport_v2/campaign.py'
      - 'research/flux_detective_v1/check.py'
      - 'research/trace_lab_v1/audit.py'
      - 'pcs/transport*kernel_v1.py'
      - 'pcs/scientific_workflow_v3.py'
      - 'pcs/scientific_contracts_v1.py'
      - 'pcs/canonical_json.py'
      - 'pcs/jsonio.py'
      - 'formal/real/PCSReal/Transport*.lean'
      - 'examples/scientific_workflow_v3/**'
      - 'scripts/activate_lean_428.sh'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'requirements-build.lock'
      - 'requirements-dev.lock'
      - '.github/workflows/pcs-trace-envelope-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-kernel-envelopes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install reviewed tools and dependencies
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          lake exe cache get
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Fresh Lean audit, independent instances and hostile replay
        env:
          PCS_ENVELOPE_EVIDENCE_DIR: ${{ runner.temp }}/envelope-lean
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m research.trace_envelope_v1.preservation > "$RUNNER_TEMP/envelope-preservation.json"
          python -m research.integration_v1.source_gate > "$RUNNER_TEMP/envelope-source-gate.json"
          python -m research.trace_envelope_v1 audit "$RUNNER_TEMP/envelope-formal"
          python -m research.trace_envelope_v1.experiment --out "$RUNNER_TEMP/envelope-experiment"
          python -m pytest -q research/trace_envelope_v1/test_envelope.py research/portable_transport_v2/test_replay.py --junitxml="$RUNNER_TEMP/envelope-tests.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: trace-envelope-actual-kernel
          path: |
            ${{ runner.temp }}/envelope-lean
            ${{ runner.temp }}/envelope-formal
            ${{ runner.temp }}/envelope-experiment
            ${{ runner.temp }}/envelope-tests.xml
            ${{ runner.temp }}/envelope-preservation.json
            ${{ runner.temp }}/envelope-source-gate.json
          retention-days: 14
