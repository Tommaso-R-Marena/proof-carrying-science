name: PCS v0.6 replay slim evidence

on:
  push:
    branches:
      - v06/replay-normalized-wire-v2

permissions:
  contents: read

jobs:
  replay-regressions:
    if: ${{ github.event.repository.private == true && github.ref_protected == true && github.event_name != 'pull_request' && vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, pcs-lean-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install PCS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run replay evidence regressions
        run: |
          python -m pytest -q \
            tests/test_environment_execute_v06.py \
            tests/test_environment_workspace_v06.py \
            tests/test_environment_replay_v06.py \
            tests/test_workflow_replay_v06.py
