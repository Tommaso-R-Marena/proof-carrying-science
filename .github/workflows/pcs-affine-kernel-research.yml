name: PCS Affine Certificate Kernel Research
on:
  pull_request:
    paths:
      - 'research/proof-gated-self-improvement-v1/**'
      - 'formal/PCS/V2/ProofGated*.lean'
      - 'formal/lean-toolchain'
      - 'scripts/activate_lean_428.sh'
      - '.github/workflows/pcs-affine-kernel-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-certificates:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Build real finite authority and require Linux isolation
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pgsi-affine-evidence"
          mkdir "$evidence"
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends bubblewrap
          fi
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 -- /usr/bin/true 2>&1 | tee "$evidence/isolation.log"
          source scripts/activate_lean_428.sh
          cd research/proof-gated-self-improvement-v1
          python build_authority.py --output "$RUNNER_TEMP/pgsi-affine-finite-native"
      - name: Kernel proofs, strict receiving and adversarial controls
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          export PCS_PGSI_AUTHORITY_BUNDLE="$RUNNER_TEMP/pgsi-affine-finite-native"
          export PCS_PGSI_REQUIRE_NATIVE=1
          evidence="$RUNNER_TEMP/pgsi-affine-evidence"
          cd research/proof-gated-self-improvement-v1
          python -m unittest discover -s kernel/tests -v 2>&1 | tee "$evidence/tests.log"
          python check_hardening_evidence.py | tee "$evidence/parent-evidence-check.json"
          python - "$RUNNER_TEMP/pgsi-affine-guard-request.json" <<'PY'
          import sys
          from pathlib import Path
          from promotion_v2 import canonical
          Path(sys.argv[1]).write_bytes(canonical({
              'old': {'relu': True, 'weight': 0, 'bias': 0},
              'candidate': {'relu': True, 'weight': 1, 'bias': 1},
              'interval': [-20, 20]}))
          PY
          python kernel/guard.py --request "$RUNNER_TEMP/pgsi-affine-guard-request.json" --output "$RUNNER_TEMP/pgsi-affine-live-guard" --bundle "$PCS_PGSI_AUTHORITY_BUNDLE" > "$evidence/live-guard-receipt.json"
          mkdir "$evidence/live-guard"
          cp "$RUNNER_TEMP/pgsi-affine-live-guard/"*.json "$RUNNER_TEMP/pgsi-affine-live-guard/"*.lean "$RUNNER_TEMP/pgsi-affine-live-guard/"*.log "$evidence/live-guard/"
      - name: Real PGSI1 counterexample and unbounded tail proof
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          evidence="$RUNNER_TEMP/pgsi-affine-evidence/supported-tail"
          mkdir "$evidence"
          cd research/proof-gated-self-improvement-v1
          python kernel/guard.py --request kernel/results/supported-tail-v1/REQUEST.json --output "$RUNNER_TEMP/pgsi-supported-tail-guard" --bundle "$RUNNER_TEMP/pgsi-affine-finite-native" > "$evidence/guard-receipt.json"
          python - "$RUNNER_TEMP/pgsi-supported-tail-guard" "$evidence" <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('kernel').resolve()))
          from replay import audit,digest
          source=Path('kernel/results/supported-tail-v1/SupportedTail.lean').resolve()
          declared=json.loads(source.with_name('RESULT.json').read_text())
          assert digest(source)==declared['proof_sha256']
          env=dict(os.environ,LEAN_PATH=sys.argv[1]+os.pathsep+str(Path('../../formal/.lake/build/lib/lean').resolve()))
          p=subprocess.run(['lean','-M4096',str(source)],env=env,capture_output=True,text=True,timeout=120)
          assert p.returncode==0 and not p.stderr,p.stdout+p.stderr
          names={'PCS.Research.SupportedTailCounterexample.concrete_errors','PCS.Research.SupportedTailCounterexample.every_tail_input_worsens'}
          result=audit(p.stdout,names)
          out=Path(sys.argv[2])
          (out/'axioms.log').write_text(p.stdout)
          (out/'axioms.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          (out/'SupportedTail.lean').write_bytes(source.read_bytes())
          receipt=json.loads((out/'guard-receipt.json').read_text())
          assert receipt['native_finite_authorization']['verdict']=='ACCEPT'
          assert receipt['kernel_checked_mathematical_guard'] and not receipt['promotion_performed']
          assert receipt['old_exact_maximum']['max_error']==583 and receipt['new_exact_maximum']['max_error']==570
          PY
          cp "$RUNNER_TEMP/pgsi-supported-tail-guard/Guard.lean" "$evidence/Guard.lean"
      - name: Replay supported counterexample family with real native authority
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          evidence="$RUNNER_TEMP/pgsi-affine-evidence"
          cd research/proof-gated-self-improvement-v1
          python kernel/experiments/supported_family.py --output "$RUNNER_TEMP/pgsi-supported-family" --bundle "$RUNNER_TEMP/pgsi-affine-finite-native" | tee "$evidence/supported-family.log"
          mkdir "$evidence/supported-family"
          cp "$RUNNER_TEMP/pgsi-supported-family/"*.json "$RUNNER_TEMP/pgsi-supported-family/"*.lean "$RUNNER_TEMP/pgsi-supported-family/"*.log "$evidence/supported-family/"
      - name: Exhaustively replay universal certificates in the kernel
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          evidence="$RUNNER_TEMP/pgsi-affine-evidence"
          campaign="$RUNNER_TEMP/pgsi-affine-campaign"
          cd research/proof-gated-self-improvement-v1
          python kernel/campaign.py --output "$campaign" | tee "$evidence/campaign.log"
          python kernel/verify_results.py --folder "$campaign" --expected kernel/results/v1/RESULTS.json | tee "$evidence/qualification.json"
          mkdir "$evidence/campaign"
          cp "$campaign/"*.json "$campaign/"*.gz "$campaign/"*.log "$evidence/campaign/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pcs-affine-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgsi-affine-evidence
          if-no-files-found: error
          retention-days: 14
