name: Model assurance studio qualification
on:
  pull_request:
    paths: ['research/model_assurance_studio_v1/**', '.github/workflows/model-assurance-studio-research.yml', 'research/integration_v2/**', 'docs/integration/2026-11-05/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-assurance-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio-kernel-runtime-and-adversarial:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Verify retained PR ancestry and unchanged production source
        run: python scripts/check_reconciled_prs.py --core "$PWD"
      - name: Install exact hashed validation and existing CPU profile
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-prover.lock -r research/model_assurance_studio_v1/requirements-validation.lock
      - name: Actual full studio tests with all declared optional backends
        working-directory: research/model_assurance_studio_v1
        run: python -m pytest -q tests --durations=10
      - name: Preserved evidence and stronger Python verifier replay
        working-directory: research/model_assurance_studio_v1
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -S scripts/verify_v07_release.py
          python scripts/reproduce_v09_envelope.py
          python scripts/reproduce_v10_dual.py
          python scripts/reproduce_v11_native.py
          python scripts/reproduce_v12_dual_decoder.py
          python scripts/reproduce_v13_affine.py
      - name: Qualified Lean exports and actual official ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          lake exe cache get
          python research/model_assurance_studio_v1/scripts/reproduce_reconciliation_v14.py --output "$RUNNER_TEMP/studio-v14" --require-kernel --require-ort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: studio-qualified-${{ github.sha }}
          path: ${{ runner.temp }}/studio-v14
          retention-days: 14

  lean-action-1-7-compatibility:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build actual protected Lean package with the updated action
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: formal
          build: true
