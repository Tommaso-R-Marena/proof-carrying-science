name: PCS Public Study Transfer Evaluation
on:
  pull_request:
    paths:
      - 'research/public_study_validation_v1/**'
      - 'research/public_study_validation_v1_results/**'
      - '.github/workflows/pcs-public-study-validation.yml'
  workflow_dispatch:
    inputs:
      real_models:
        description: Download pinned weights and perform the complete registered generation/receiving experiment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-and-input-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m research.integration_v2.boundary research.public_study_validation_v1.preservation
          python -m pytest -q research/public_study_validation_v1/test_study.py
  output-boundary-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Rebuild dependencies, audit six theorems and independently check objects
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          source scripts/activate_lean_428.sh
          PYTHONPATH=. python research/public_study_validation_v1_results/check_proofs.py "$RUNNER_TEMP/output-boundary-proofs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-study-output-boundary-proofs
          path: |
            ${{ runner.temp }}/output-boundary-proofs/*.json
            ${{ runner.temp }}/output-boundary-proofs/*.lean
          if-no-files-found: error
  actual-local-weights-and-receiving:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_models }}
    needs: source-and-input-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Actual pinned local inference and fresh independent receiving
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m research.integration_v2.boundary research.public_study_validation_v1.preservation
          source scripts/activate_lean_428.sh
          python -c 'import os; from pathlib import Path; from research.public_study_validation_v1.runtime import download; print(download(Path(os.environ["RUNNER_TEMP"])/"weights")))'
          python -m research.public_study_validation_v1.study run "$RUNNER_TEMP/study" --weights "$RUNNER_TEMP/weights"
          PYTHONPATH=. python research/public_study_validation_v1_results/receiving.py "$RUNNER_TEMP/study" "$RUNNER_TEMP/receiving"
          python -m research.public_study_validation_v1_results.audit_results "$RUNNER_TEMP/study" "$RUNNER_TEMP/receiving" "$RUNNER_TEMP/study-post-run-audit.json"
          PCS_PUBLIC_STUDY_EVIDENCE="$RUNNER_TEMP/study" python -m pytest -q research/public_study_validation_v1_results/test_recorded_evidence.py --junitxml="$RUNNER_TEMP/study-negative-tests.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-study-actual-model-evidence
          path: |
            ${{ runner.temp }}/study-negative-tests.xml
            ${{ runner.temp }}/study-post-run-audit.json
            ${{ runner.temp }}/study/**/*.json
            ${{ runner.temp }}/study/**/*.lean
            ${{ runner.temp }}/receiving/**/*.json
            ${{ runner.temp }}/receiving/**/*.lean
          if-no-files-found: error
