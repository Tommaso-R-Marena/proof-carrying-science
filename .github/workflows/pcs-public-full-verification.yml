name: PCS Public Full Verification

# Never enable hosted runner usage in the private repository. This is a
# no-secret pull_request pipeline, not a privileged deploy/release workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-public-verified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proposed PR merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Audit revision, repository governance, and Python source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "PCS_PUBLIC_TESTED_MERGE_SHA=$(git rev-parse HEAD)"
          echo "PCS_PUBLIC_SOURCE_HEAD_SHA=$PR_HEAD_SHA"
          python scripts/check_repository_integrity.py
          python -m compileall -q pcs scripts tests
      - name: Verify public release policies are present
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f CONTRIBUTING.md
          test -f docs/PUBLIC_RELEASE_GATE.md
          grep -q 'TERMS AND CONDITIONS FOR USE, REPRODUCTION, AND DISTRIBUTION' LICENSE
      - name: Exercise disclosure-audit unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest -q tests/test_public_release_history_audit.py
          python -m pytest -q tests/test_semantic_translation_v1.py tests/test_semantic_confirmation_v1.py
          python -m pytest -q tests/test_semantic_kernel_bridge_v1.py tests/test_semantic_golden_benchmark_v1.py tests/test_semantic_claim_binding_v1.py

  core-full-gate:
    name: core-full-gate
    needs: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out proposed integration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Set up Node 22 for Python/JavaScript byte-contract tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: Confirm immutable tested source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "PCS_PUBLIC_TESTED_MERGE_SHA=$(git rev-parse HEAD)"
          echo "PCS_PUBLIC_SOURCE_HEAD_SHA=$PR_HEAD_SHA"
          test -f scripts/core_ci_cloudflare.sh
      - name: Require complete Aristotle semantic source overlay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_aristotle_semantic_source_v1.py
      - name: Full Lean kernel, real compiled authority, Python, and adversarial gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/core_ci_cloudflare.sh
      - name: Genuine compiled semantic authority fixtures and Python client
        shell: bash
        run: |
          set -euo pipefail
          cd formal
          bash tools/run_semantic_fixture_tests.sh
          bash tools/run_semantic_v2_fixture_tests.sh
          bash tools/check_semantic_v3_audit.sh
          bash tools/run_semantic_v3_fixture_tests.sh
          python3 -m unittest discover -s python/tests
      - name: Pin binary and replay 36 semantic requests through PCS Python adapter
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_semantic_kernel_bridge_vectors_v1.py > "$RUNNER_TEMP/semantic-cross-language-evidence.json"
          python - <<'PY'
          import json, os, pathlib
          d = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'semantic-cross-language-evidence.json').read_text())
          assert d['passed'] == 36 and d['pcs_scientific_authority'] is False
          PY
      - name: Independent Python/JavaScript serialization stress gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_v06_serialization_gate.py
      - name: Frozen complete cross-language v0.6 byte-contract gate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python scripts/run_v06_contract_gate.py --results-root "$RUNNER_TEMP/v06-contract-runs"
      - name: Retain exact-source toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/public-ci-evidence"
          {
            echo "PCS_PUBLIC_COMPLETE_GATE_PASS"
            echo "tested_merge_sha=$(git rev-parse HEAD)"
            echo "source_head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            python --version
            node --version
            lean --version || "$HOME/.elan/bin/lean" --version
            lake --version || "$HOME/.elan/bin/lake" --version
          } | tee "$RUNNER_TEMP/public-ci-evidence/build-identity.txt"
      - name: Upload cross-language and toolchain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pcs-public-full-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-ci-evidence/
            ${{ runner.temp }}/v06-contract-runs/
            ${{ runner.temp }}/semantic-cross-language-evidence.json
          if-no-files-found: warn
          retention-days: 14

  real-analysis-bridge:
    name: real-analysis-bridge
    needs: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pinned real-analysis kernel build and axiom audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          source scripts/activate_lean_428.sh
          lake exe cache get
          bash scripts/verify_lean_real.sh

  certiforge-integration:
    name: certiforge-integration
    needs: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve exact public component source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Tommaso-R-Marena/certiforge
          ref: b27729cd47f04fb0d022ce817042bbceaab9c5f4
          path: .ci-components/certiforge
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Build real pinned Rust component and separate Lean workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          mv .ci-components/certiforge "$RUNNER_TEMP/pcs-certiforge"
          rmdir .ci-components
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          cd "$RUNNER_TEMP/pcs-certiforge"
          test "$(git rev-parse HEAD)" = b27729cd47f04fb0d022ce817042bbceaab9c5f4
          rustup override set 1.99.0
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --workspace --locked
          source scripts/activate_lean_416.sh
          (cd formal && lake build && lake env lean CertiForge/AxiomAudit.lean)
      - name: Execute actual PCS optimizer/checker/binding/negative-control demo
        run: |
          set -euo pipefail
          python scripts/run_certiforge_integration_v1.py --checkout "$RUNNER_TEMP/pcs-certiforge" --output "$RUNNER_TEMP/pcs-integrated-demo"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pcs-integrated-demo'
          r = json.loads((p / 'result.json').read_text())
          assert r['optimization']['state'] == 'CHECKED_EXHAUSTIVE'
          assert r['optimization']['pcs_authority'] is False
          assert r['malicious_rebound_optimization']['state'] == 'REJECTED'
          assert r['formal_promotion'] is False
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: pcs-certiforge-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcs-integrated-demo/
          if-no-files-found: warn
          retention-days: 14

  python-portability:
    name: portability-${{ matrix.os }}-py${{ matrix.python }}
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: windows-2022, python: "3.12"}
          - {os: macos-15, python: "3.12"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install public Python verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile all PCS Python sources
        run: python -m compileall -q pcs scripts tests
      - name: Run cross-platform parser, canonicalization, and disclosure checks
        run: python -m pytest -q tests/test_strict_json.py tests/test_canonical_json_v06.py tests/test_public_release_history_audit.py tests/test_semantic_translation_v1.py

  verified-public-integration:
    name: verified-public-integration
    needs: [source-policy, core-full-gate, real-analysis-bridge, certiforge-integration, python-portability]
    if: ${{ always() && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject skipped, missing, cancelled, and failed prerequisite checks
        shell: bash
        env:
          SOURCE_POLICY: ${{ needs.source-policy.result }}
          FULL_CORE: ${{ needs.core-full-gate.result }}
          REAL_ANALYSIS: ${{ needs.real-analysis-bridge.result }}
          CERTIFORGE: ${{ needs.certiforge-integration.result }}
          PORTABILITY: ${{ needs.python-portability.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_POLICY" = success || { echo "::error::Source policy did not succeed ($SOURCE_POLICY)"; exit 1; }
          test "$FULL_CORE" = success || { echo "::error::Full Lean/Python/adversarial gate did not succeed ($FULL_CORE)"; exit 1; }
          test "$REAL_ANALYSIS" = success || { echo "::error::Real-analysis kernel and axiom audit did not succeed ($REAL_ANALYSIS)"; exit 1; }
          test "$CERTIFORGE" = success || { echo "::error::PCS/CertiForge integration did not succeed ($CERTIFORGE)"; exit 1; }
          test "$PORTABILITY" = success || { echo "::error::Python portability suite did not succeed ($PORTABILITY)"; exit 1; }
          echo "PCS_PUBLIC_VERIFIED_INTEGRATION_PASS"
