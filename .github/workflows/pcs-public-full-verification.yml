name: PCS Public Full Verification

# Never enable hosted runner usage in the private repository. This is a
# no-secret pull_request pipeline, not a privileged deploy/release workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-public-verified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-learning-loop:
    name: lean-learning-loop
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install hash-pinned CPU research dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock -r requirements-prover.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Genuine Lean state, training, sequential reward and integrity tests
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          PCS_REQUIRE_PROVER=1 python -m pytest -q tests/test_lean_learning_loop.py tests/test_checked_reuse.py tests/test_induction_discovery.py tests/test_bridge_data.py tests/test_public_proof_transport.py tests/test_verified_memory.py tests/test_memory_wire.py tests/test_memory_resume.py tests/test_memory_recording.py tests/test_prospective_hybrid.py tests/test_hybrid_cli.py tests/test_mathematical_evidence.py tests/test_dag_policy_v3.py tests/test_dag_policy_v3_research.py tests/test_premise_policy_v4.py tests/test_premise_learning_v4.py tests/test_mathlib_environment_v4.py tests/test_benchmark_mathlib_v4.py tests/test_abstraction_v4.py tests/test_evidence_journal_v4.py tests/test_worker_initialization_v4.py tests/test_mathlib_cli_v4.py
          python scripts/check_memory_evidence.py
          python scripts/check_memory_runtime.py
          lean formal/PCSVerifiedMemoryBoundary.lean
          python scripts/check_induction_evidence.py
          python scripts/check_abstraction_proofs.py
          lean -o "$RUNNER_TEMP/PCSProofBoundary.olean" formal/PCSProofBoundary.lean
          cat > "$RUNNER_TEMP/FalseCertificate.lean" <<'LEAN'
          import PCSProofBoundary
          example : PCSProofBoundary.Certificate False := ⟨True.intro⟩
          LEAN
          if LEAN_PATH="$RUNNER_TEMP" lean "$RUNNER_TEMP/FalseCertificate.lean" > "$RUNNER_TEMP/false-certificate.log" 2>&1; then
            echo "False certificate accepted" >&2
            exit 1
          fi
          grep -q 'Type mismatch\|Application type mismatch' "$RUNNER_TEMP/false-certificate.log"
      - name: Train small real checkpoints and execute published learned policy
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pcs.experimental.prover.experiment --output "$RUNNER_TEMP/lean-smoke" --epochs 3 --episodes 3 --seeds 17
          python -m pcs.experimental.prover.cli 'For every natural number t, (t + 0) * 1 equals t.' --models research/lean-learning-v2 --output "$RUNNER_TEMP/end-to-end.json"
          python -m pcs.experimental.prover.cli 'For all natural numbers a, b and c, if ((a + b equals c) and (c * 1 equals c)) then ((c * 1 equals c) and (a + b equals c)).' --models research/checked-reuse-v1 --output "$RUNNER_TEMP/checked-reuse.json"
          python -m pcs.experimental.prover.dag_experiment_v3 solve --checkpoint research/dag-policy-v3/dag.json --sha256 4af8b94a6be4996d3f08e73b9b0d6a91610ef5c4b88d783f185c630076a8d8a6 --goal research/dag-policy-v3/checkpoint-cli-goal.json --output "$RUNNER_TEMP/dag-proof.json"
          lake exe cache get
          python -m pcs.experimental.prover.mathlib_cli_v4 "∀ (f : Nat → Nat) (s t : Set Nat), f ⁻¹' (s ∩ t) = (f ⁻¹' s) ∩ (f ⁻¹' t)" --checkpoint research/mathlib-learning-v4-kernel-checked/graph-71.json --checkpoint-sha256 2dda734ec84354efe2ab850e43dc4ced72a57afa75f8cbcec137db71f93fa583 --output "$RUNNER_TEMP/learned-mathlib-proof.json"
          python - <<'PYMATHLEARN'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'learned-mathlib-proof.json').read_text())
          assert r['status'] == 'verified' and r['pcs_authority'] is False
          assert any(a['kind'] == 'apply_lemma' for a in r['result']['receipt']['actions'])
          PYMATHLEARN
          python scripts/check_reuse_evidence.py
          python - <<'PYREUSE'
          import json, os
          from pathlib import Path
          from pcs.experimental.prover.environment import search
          from pcs.experimental.prover.library import LibraryEnvironment
          from pcs.experimental.prover.reuse_model import ReuseNetwork
          folder = Path('research/checked-reuse-v2')
          registry = json.loads((folder / 'registry.json').read_text())
          entry = next(e for e in registry['models'] if e['id'] == registry['selected_local_experiment'])
          model = ReuseNetwork.load(folder / entry['checkpoint'], entry['sha256'])
          task = next(t for t in json.loads((folder / 'tasks.json').read_text()) if t['id'] == 'nat_three_edge_chain')
          env = LibraryEnvironment(json.loads((folder / 'library.json').read_text()), timeout=30)
          try:
              result = search(env, task['goal'], model.rank, budget=64, beam=4)
              assert result['status'] == 'verified' and len(result['receipt']['actions']) >= 5
              (Path(os.environ['RUNNER_TEMP']) / 'feedback-proof.json').write_text(json.dumps(result))
          finally:
              env.close()
          PYREUSE
          python scripts/evaluate_lean_formalization.py --models research/lean-learning-v2 --output "$RUNNER_TEMP/formalization-fidelity.json"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root / 'end-to-end.json').read_text())
          assert result['status'] == 'verified' and result['pcs_authority'] is False
          assert result['search']['receipt']['kernel']['axioms'] == []
          reused = json.loads((root / 'checked-reuse.json').read_text())
          assert reused['status'] == 'verified' and reused['pcs_authority'] is False
          assert any(a['argument'] and a['argument'].startswith('PCSReuseL') for a in reused['search']['receipt']['actions'])
          report = json.loads((root / 'lean-smoke/rl-training.json').read_text())
          assert all(r['weights_changed'] for r in report.values())
          PY

  source-policy:
    name: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proposed PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Audit revision, repository governance, and Python source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "PCS_PUBLIC_TESTED_MERGE_SHA=$(git rev-parse HEAD)"
          echo "PCS_PUBLIC_SOURCE_HEAD_SHA=$PR_HEAD_SHA"
          python scripts/check_repository_integrity.py
          python scripts/check_research_platform_evidence.py
          python scripts/check_mathlib_v4_evidence.py
          python -m compileall -q pcs scripts tests
      - name: Bind contribution file gates to required PR verification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_pr_contributions.py
      - name: Verify public release policies are present
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f CONTRIBUTING.md
          test -f docs/PUBLIC_RELEASE_GATE.md
          grep -q 'TERMS AND CONDITIONS FOR USE, REPRODUCTION, AND DISTRIBUTION' LICENSE
      - name: Exercise disclosure-audit unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest -q tests/test_public_release_history_audit.py
          python -m pytest -q tests/test_semantic_translation_v1.py tests/test_semantic_confirmation_v1.py
          python -m pytest -q tests/test_semantic_kernel_bridge_v1.py tests/test_semantic_golden_benchmark_v1.py tests/test_semantic_claim_binding_v1.py
      - name: Reject forged qualification, provenance and signing-policy evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_release_qualification_v1.py tests/test_release_provenance_inventory.py tests/test_signing_policy_v1.py tests/test_signing_recovery_drill.py tests/test_key_lifecycle.py tests/test_key_lifecycle_files.py

  core-full-gate:
    name: core-full-gate
    needs: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: proof-carrying-science
    steps:
      - name: Check out proposed integration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: proof-carrying-science
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Set up Node 22 for Python/JavaScript byte-contract tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
      - name: Confirm immutable tested source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "PCS_PUBLIC_TESTED_MERGE_SHA=$(git rev-parse HEAD)"
          echo "PCS_PUBLIC_SOURCE_HEAD_SHA=$PR_HEAD_SHA"
          test -f scripts/core_ci_cloudflare.sh
      - name: Require complete Aristotle semantic source overlay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_aristotle_semantic_source_v1.py
      - name: Bounded temporary swap for large kernel controls on the standard public runner
        shell: bash
        run: |
          set -euo pipefail
          # Keep the existing free standard runner; never request a paid large runner.
          # These are preinstalled SDKs unused by this Python/Node/Rust/Lean job.
          # Only runner image directories are removed; no repository/user files.
          sudo -n rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
          python - <<'PYSPACE'
          import os
          st = os.statvfs(os.environ['RUNNER_TEMP'])
          assert st.f_bavail * st.f_frsize >= 34 * 1024**3, 'Insufficient disk for bounded kernel swap'
          PYSPACE
          SWAP_FILE="$RUNNER_TEMP/pcs-kernel-controls.swap"
          test ! -e "$SWAP_FILE"
          sudo -n fallocate -l 32G "$SWAP_FILE"
          sudo -n chmod 600 "$SWAP_FILE"
          sudo -n mkswap "$SWAP_FILE"
          sudo -n swapon "$SWAP_FILE"
          free -m
      - name: Check out pinned browser reasoning implementations for reference parity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tommaso-R-Marena/proof-carrying-science-site
          ref: a6a9a54bb8f2e8fb45f783a9df56929aca11a54b
          path: .ci-components/pcs-site
          persist-credentials: false
      - name: Fresh source-extracted conditional libraries and full axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/audit_lean_source.py formal/PCSActionShield.lean formal/PCSActionShieldControls.lean formal/PCSConditionalShieldBridge.lean formal/PCSConditionalShieldRuntime.lean formal/PCSActionShieldIntegrationAudit.lean
          (cd formal && lake build +PCSRuntimeRefinement.SourceText:leanArts PCSOmega PCSDecisionDiagram)
          # Sequential ordinary-kernel builds preserve every source obligation.
          # Use only the existing standard runner and bounded swap above.
          python scripts/verify_conditional_runtime_refinement.py --build --memory-mb 32000 --heavy-timeout 3600 --build-output "$RUNNER_TEMP/conditional-complete-build.json" --site "$GITHUB_WORKSPACE/.ci-components/pcs-site" --negative-controls --output "$RUNNER_TEMP/conditional-refinement.json"
          python scripts/verify_conditional_runtime_parity.py --site "$GITHUB_WORKSPACE/.ci-components/pcs-site" --cases 90 --output "$RUNNER_TEMP/conditional-extracted-parity"
          cd formal
          for module in PCSActionShield PCSActionShieldControls PCSConditionalShieldBridge PCSConditionalShieldRuntime; do
            memory_mb=1024
            if [ "$module" = PCSConditionalShieldRuntime ]; then memory_mb=6000; fi
            lake env lean -j1 -M"$memory_mb" -D Elab.async=false -o ".lake/build/lib/lean/$module.olean" "$module.lean"
          done
          lake env lean PCSActionShieldAudit.lean
          cd ..
          python scripts/verify_action_shield_integration.py --output "$RUNNER_TEMP/action-shield-integration-axioms.json"
      - name: Full Lean kernel, real compiled authority, Python, and adversarial gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/core_ci_cloudflare.sh
      - name: Independently replay universal shield and signed safety-case attacks
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/run_action_shield_campaign_v1.py --output "$RUNNER_TEMP/action-shield-campaign"
          python scripts/run_ai_safety_assurance_v1.py --output "$RUNNER_TEMP/signed-action-shield-case"
      - name: Check out source-bound CertiForge interpreter and repaired type checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tommaso-R-Marena/certiforge
          ref: c71e8575db2800b015a9d444f8ed572490f3a871
          path: .ci-components/certiforge
          persist-credentials: false
      - name: Verify runtime extraction windows against exact component sources
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/verify_runtime_refinement.py --site "$GITHUB_WORKSPACE/.ci-components/pcs-site" --certiforge "$GITHUB_WORKSPACE/.ci-components/certiforge" --output "$RUNNER_TEMP/runtime-refinement.json"
          python scripts/verify_math_language_parity.py --output "$RUNNER_TEMP/math-language-parity.json"
      - name: Kernel-check the Rust helper extraction and canonical-input boundary
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/verify_runtime_value_type.py --certiforge "$GITHUB_WORKSPACE/.ci-components/certiforge" --output "$RUNNER_TEMP/runtime-value-type.json"
          python scripts/verify_runtime_canonical_boundary.py --certiforge "$GITHUB_WORKSPACE/.ci-components/certiforge" --output "$RUNNER_TEMP/runtime-canonical-boundary.json"
          cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/.ci-components/certiforge/Cargo.toml"
          python scripts/verify_runtime_checked_boundary.py --certiforge "$GITHUB_WORKSPACE/.ci-components/certiforge" --native --negative-controls --output "$RUNNER_TEMP/runtime-checked-boundary.json"
          python scripts/verify_runtime_output_boundary_v3.py --certiforge "$GITHUB_WORKSPACE/.ci-components/certiforge" --native --negative-controls --output "$RUNNER_TEMP/runtime-output-boundary-v3.json"
      - name: Bounded real conditional runtime differential smoke
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          # Native Rust regressions are checked by certiforge-integration. The
          # low-level Rust extraction requires canonical inputs; do not compare
          # an unextracted historical top-level loop with a changed public guard.
          python scripts/runtime_differential.py --mode conditional --cases 8 --seed 20261012 --site "$GITHUB_WORKSPACE/.ci-components/pcs-site" --certiforge "$GITHUB_WORKSPACE/.ci-components/certiforge" --output "$RUNNER_TEMP/runtime-conditional-smoke.json"
      - name: Compare actual Lean, Python and JavaScript bounded reasoning outputs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/verify_omega_dd_parity.py --site ../.ci-components/pcs-site --output "$RUNNER_TEMP/omega-dd-parity"
      - name: Genuine compiled semantic authority fixtures and Python client
        shell: bash
        run: |
          set -euo pipefail
          cd formal
          bash tools/run_semantic_fixture_tests.sh
          bash tools/run_semantic_v2_fixture_tests.sh
          bash tools/check_semantic_v3_audit.sh
          bash tools/run_semantic_v3_fixture_tests.sh
          python3 -m unittest discover -s python/tests
      - name: Pin binary and replay 36 semantic requests through PCS Python adapter
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_semantic_kernel_bridge_vectors_v1.py > "$RUNNER_TEMP/semantic-cross-language-evidence.json"
          python - <<'PY'
          import json, os, pathlib
          d = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'semantic-cross-language-evidence.json').read_text())
          assert d['passed'] == 36 and d['pcs_scientific_authority'] is False
          PY
      - name: Independent Python/JavaScript serialization stress gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_v06_serialization_gate.py
      - name: Frozen complete cross-language v0.6 byte-contract gate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python scripts/run_v06_contract_gate.py --results-root "$RUNNER_TEMP/v06-contract-runs"
      - name: Actual Omega CPU training, held-out replay and Lean rejection control
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pcs.cli omega reproduce --output "$RUNNER_TEMP/omega-ci" --per-family 4 --epochs 4 --bandit-episodes 32
          python -m pcs.cli omega verify-lean "$RUNNER_TEMP/omega-ci"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'omega-ci'
          report = json.loads((root / 'lean-result.json').read_text())
          assert report['positive_theorems'] > 0 and report['negative_target_rejected']
          assert report['pcs_authority'] is False
          for name in ('bag', 'graph', 'bandit'):
              model = json.loads((root / 'models' / (name + '.json')).read_text())
              assert any(model['weights']) and model['authority'] == 'NONE'
          PY
      - name: Counterexample memory and trained nonlinear search with independent Lean controls
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pcs.cli omega adaptive-reproduce --output "$RUNNER_TEMP/omega-adaptive-ci" --per-family 4
          python scripts/verify_adaptive_lean.py "$RUNNER_TEMP/omega-adaptive-ci"
      - name: Actual conditional reasoning, work limits and independent Lean controls
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/benchmark_conditional.py --output "$RUNNER_TEMP/conditional-ci"
          python scripts/verify_conditional_lean.py "$RUNNER_TEMP/conditional-ci"
      - name: Exact weighted interventions and independent Lean minimum/count controls
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/benchmark_intervention.py --output "$RUNNER_TEMP/intervention-ci"
          python scripts/verify_intervention_lean.py "$RUNNER_TEMP/intervention-ci"
      - name: Retain exact-source toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/public-ci-evidence"
          {
            echo "PCS_PUBLIC_COMPLETE_GATE_PASS"
            echo "tested_merge_sha=$(git rev-parse HEAD)"
            echo "source_head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            python --version
            node --version
            lean --version || "$HOME/.elan/bin/lean" --version
            lake --version || "$HOME/.elan/bin/lake" --version
          } | tee "$RUNNER_TEMP/public-ci-evidence/build-identity.txt"
      - name: Upload cross-language and toolchain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pcs-public-full-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-ci-evidence/
            ${{ runner.temp }}/v06-contract-runs/
            ${{ runner.temp }}/semantic-cross-language-evidence.json
            ${{ runner.temp }}/omega-ci/
            ${{ runner.temp }}/omega-adaptive-ci/
            ${{ runner.temp }}/conditional-ci/
            ${{ runner.temp }}/intervention-ci/
            ${{ runner.temp }}/runtime-refinement.json
            ${{ runner.temp }}/math-language-parity.json
            ${{ runner.temp }}/runtime-value-type.json
            ${{ runner.temp }}/runtime-canonical-boundary.json
            ${{ runner.temp }}/runtime-conditional-smoke.json
            ${{ runner.temp }}/conditional-complete-build.json
            ${{ runner.temp }}/conditional-refinement.json
            ${{ runner.temp }}/action-shield-integration-axioms.json
            ${{ runner.temp }}/conditional-extracted-parity/
            ${{ runner.temp }}/action-shield-campaign/
            ${{ runner.temp }}/signed-action-shield-case/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary kernel swap
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          SWAP_FILE="$RUNNER_TEMP/pcs-kernel-controls.swap"
          if test -f "$SWAP_FILE"; then
            if sudo -n swapon --noheadings --show=NAME | grep -Fxq "$SWAP_FILE"; then
              sudo -n swapoff "$SWAP_FILE"
            fi
            sudo -n rm -- "$SWAP_FILE"
          fi

  real-analysis-bridge:
    name: real-analysis-bridge
    needs: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Pinned real-analysis kernel build and axiom audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          source scripts/activate_lean_428.sh
          lake exe cache get
          bash scripts/verify_lean_real.sh
          python -m pcs.experimental.prover.mathlib_cli_v4 "∀ (f : Nat → Nat) (s t : Set Nat), f ⁻¹' (s ∩ t) = (f ⁻¹' s) ∩ (f ⁻¹' t)" --output "$RUNNER_TEMP/mathlib-multistep.json"
          python - <<'PYMATHLIB'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'mathlib-multistep.json').read_text())
          assert result['status'] == 'verified' and result['pcs_authority'] is False
          assert len(result['result']['receipt']['actions']) >= 3
          PYMATHLIB
      - name: Universal transport proofs and fresh signed receiving controls
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          lake -d formal build pcs-lean-authority
          python scripts/verify_transport_formal.py --output "$RUNNER_TEMP/transport-static-axioms.json"
          PCS_REQUIRE_TRANSPORT_KERNEL=1 python -m pytest -q tests/test_transport_kernel_v1.py
          python scripts/run_transport_kernel_v1.py --output "$RUNNER_TEMP/transport-kernel-campaign"
      - name: Kernel-prove recorded transport traces and receiving attacks
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python scripts/verify_transport_trace_formal.py --output "$RUNNER_TEMP/transport-trace-static-axioms.json"
          PCS_REQUIRE_TRANSPORT_TRACE_KERNEL=1 python -m pytest -q tests/test_transport_trace_kernel_v1.py
          python scripts/run_transport_trace_kernel_v1.py --output "$RUNNER_TEMP/transport-trace-campaign" --signed-base "$RUNNER_TEMP/transport-kernel-campaign/signed-v3-base"
      - name: Retain universal transport receiving evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pcs-transport-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/transport-static-axioms.json
            ${{ runner.temp }}/transport-trace-static-axioms.json
            ${{ runner.temp }}/transport-trace-campaign/
            ${{ runner.temp }}/transport-kernel-campaign/
          if-no-files-found: warn
          retention-days: 14

      - name: Real experimental calibration, minimax proofs and held-out comparisons
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          mkdir "$RUNNER_TEMP/calibration-data-rights"
          cp examples/experimental_calibration_v1/ATTRIBUTION.md examples/experimental_calibration_v1/provenance.json examples/experimental_calibration_v1/UPSTREAM_LICENSE.txt "$RUNNER_TEMP/calibration-data-rights/"
          # Reuse the already hash-pinned CPU numerical baseline; no training.
          python - <<'PYCALLOCK'
          import os
          from pathlib import Path
          lines = [line for line in Path('requirements-prover.lock').read_text().splitlines() if line.startswith('numpy==')]
          assert len(lines) == 1
          (Path(os.environ['RUNNER_TEMP']) / 'calibration-baseline.lock').write_text(lines[0] + '\n')
          PYCALLOCK
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/calibration-baseline.lock"
          python scripts/verify_calibration_formal.py --output "$RUNNER_TEMP/calibration-static-axioms.json"
          python scripts/verify_calibration_numeric_evidence.py --output "$RUNNER_TEMP/calibration-numeric-axioms.json"
          PCS_REQUIRE_CALIBRATION_KERNEL=1 python -m pytest -q tests/test_calibration_kernel_v1.py
          python -m pytest -q tests/test_calibration_numeric_evidence.py
          python scripts/run_experimental_calibration_v1.py --output "$RUNNER_TEMP/experimental-calibration"
          python scripts/run_calibration_attacks_v1.py --output "$RUNNER_TEMP/calibration-attacks"
      - name: Retain real experimental calibration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pcs-experimental-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/calibration-static-axioms.json
            ${{ runner.temp }}/calibration-numeric-axioms.json
            ${{ runner.temp }}/calibration-data-rights/
            ${{ runner.temp }}/experimental-calibration/
            ${{ runner.temp }}/calibration-attacks/
          if-no-files-found: warn
          retention-days: 14

  certiforge-integration:
    name: certiforge-integration
    needs: source-policy
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve exact public component source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tommaso-R-Marena/certiforge
          ref: c71e8575db2800b015a9d444f8ed572490f3a871
          path: .ci-components/certiforge
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Build real pinned Rust component and separate Lean workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          mv .ci-components/certiforge "$RUNNER_TEMP/pcs-certiforge"
          rmdir .ci-components
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          cd "$RUNNER_TEMP/pcs-certiforge"
          test "$(git rev-parse HEAD)" = c71e8575db2800b015a9d444f8ed572490f3a871
          rustup override set 1.99.0
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --workspace --locked
          source scripts/activate_lean_416.sh
          (cd formal && lake build && lake env lean CertiForge/AxiomAudit.lean)
      - name: Execute actual PCS optimizer/checker/binding/negative-control demo
        run: |
          set -euo pipefail
          python scripts/run_certiforge_integration_v1.py --checkout "$RUNNER_TEMP/pcs-certiforge" --output "$RUNNER_TEMP/pcs-integrated-demo"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pcs-integrated-demo'
          r = json.loads((p / 'result.json').read_text())
          assert r['optimization']['state'] == 'CHECKED_EXHAUSTIVE'
          assert r['optimization']['pcs_authority'] is False
          assert r['malicious_rebound_optimization']['state'] == 'REJECTED'
          assert r['formal_promotion'] is False
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: pcs-certiforge-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcs-integrated-demo/
          if-no-files-found: warn
          retention-days: 14

  python-portability:
    name: portability-${{ matrix.os }}-py${{ matrix.python }}
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: windows-2022, python: "3.12"}
          - {os: macos-15, python: "3.12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install public Python verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile all PCS Python sources
        run: python -m compileall -q pcs scripts tests
      - name: Run cross-platform parser, canonicalization, and disclosure checks
        run: python -m pytest -q tests/test_strict_json.py tests/test_canonical_json_v06.py tests/test_public_release_history_audit.py tests/test_semantic_translation_v1.py tests/test_conditional_reasoning.py tests/test_intervention.py

  verified-public-integration:
    name: verified-public-integration
    needs: [source-policy, core-full-gate, real-analysis-bridge, certiforge-integration, python-portability, lean-learning-loop]
    if: ${{ always() && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject skipped, missing, cancelled, and failed prerequisite checks
        shell: bash
        env:
          SOURCE_POLICY: ${{ needs.source-policy.result }}
          FULL_CORE: ${{ needs.core-full-gate.result }}
          REAL_ANALYSIS: ${{ needs.real-analysis-bridge.result }}
          CERTIFORGE: ${{ needs.certiforge-integration.result }}
          PORTABILITY: ${{ needs.python-portability.result }}
          LEAN_LEARNING: ${{ needs.lean-learning-loop.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_POLICY" = success || { echo "::error::Source policy did not succeed ($SOURCE_POLICY)"; exit 1; }
          test "$FULL_CORE" = success || { echo "::error::Full Lean/Python/adversarial gate did not succeed ($FULL_CORE)"; exit 1; }
          test "$REAL_ANALYSIS" = success || { echo "::error::Real-analysis kernel and axiom audit did not succeed ($REAL_ANALYSIS)"; exit 1; }
          test "$CERTIFORGE" = success || { echo "::error::PCS/CertiForge integration did not succeed ($CERTIFORGE)"; exit 1; }
          test "$PORTABILITY" = success || { echo "::error::Python portability suite did not succeed ($PORTABILITY)"; exit 1; }
          test "$LEAN_LEARNING" = success || { echo "::error::Actual Lean learning loop did not succeed ($LEAN_LEARNING)"; exit 1; }
          echo "PCS_PUBLIC_VERIFIED_INTEGRATION_PASS"
