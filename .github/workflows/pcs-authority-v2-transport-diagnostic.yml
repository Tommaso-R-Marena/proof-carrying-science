name: PCS Authority V2 Inherited Transport Diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/pcs-authority-v2-transport-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unchanged-transport-reproduction:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Reproduce unchanged mandatory commands and expose bounded diagnostics
        shell: bash
        run: |
          set -uo pipefail
          set +e  # Capture the unchanged command status before re-emitting it below.
          mkdir -p "$RUNNER_TEMP/transport-diagnostic"
          (
            set -euo pipefail
            source scripts/activate_lean_428.sh
            lake exe cache get
            bash scripts/verify_lean_real.sh
            python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
            python -m pip install --no-deps --no-build-isolation -e .
            lake -d formal build pcs-lean-authority
            python scripts/verify_transport_formal.py --output "$RUNNER_TEMP/transport-diagnostic/static.json"
            PCS_REQUIRE_TRANSPORT_KERNEL=1 python -m pytest -q tests/test_transport_kernel_v1.py --junitxml="$RUNNER_TEMP/transport-diagnostic/model-tests.xml"
            python scripts/run_transport_kernel_v1.py --output "$RUNNER_TEMP/transport-diagnostic/model"
            python scripts/verify_transport_trace_formal.py --output "$RUNNER_TEMP/transport-diagnostic/trace-static.json"
            python - <<'PYPROBE'
          import hashlib,json,platform,resource,sys
          from pathlib import Path
          from pcs import transport_trace_kernel_v1 as trace
          root=Path.cwd()
          result=trace.replay((root/'examples/scientific_workflow_v3/contract.json').read_bytes(), (root/'examples/scientific_workflow_v3/trajectory.csv').read_bytes())
          print('ACTUAL_LITERAL_TRACE_PROBE', json.dumps({'python':sys.version,'platform':platform.platform(),'stack_limit':resource.getrlimit(resource.RLIMIT_STACK),'accepted':result['accepted'],'kernel':result.get('kernel')},sort_keys=True))
          Path(__import__('os').environ['RUNNER_TEMP'],'transport-diagnostic/actual-literal-probe.json').write_text(json.dumps(result,indent=2)+'\n')
          assert result['accepted'], 'Actual Lean literal probe failed; full subprocess stdout/stderr retained above'
          original_stack=resource.getrlimit(resource.RLIMIT_STACK)
          limits=[4*1024*1024,8*1024*1024,16*1024*1024,8*1024*1024]
          frozen={name:hashlib.sha256(raw).hexdigest() for name,raw in trace.sources().items()}
          print('STACK_COMPARISON_PREREGISTRATION',json.dumps({'limits':limits,'source_sha256':frozen,'same_contract_and_csv':True,'no_verdict_cache':True}))
          campaign=[]
          try:
              for limit in limits:
                  resource.setrlimit(resource.RLIMIT_STACK,(limit,original_stack[1]))
                  trial=trace.replay((root/'examples/scientific_workflow_v3/contract.json').read_bytes(),(root/'examples/scientific_workflow_v3/trajectory.csv').read_bytes())
                  kernel=trial.get('kernel',{})
                  row={'stack_bytes':limit,'accepted':trial['accepted'],'kernel_status':kernel.get('status'),'kernel':kernel}
                  campaign.append(row)
                  print('ACTUAL_STACK_COMPARISON',json.dumps(row,sort_keys=True))
          finally:
              resource.setrlimit(resource.RLIMIT_STACK,original_stack)
          assert frozen=={name:hashlib.sha256(raw).hexdigest() for name,raw in trace.sources().items()}
          Path(__import__('os').environ['RUNNER_TEMP'],'transport-diagnostic/stack-comparison.json').write_text(json.dumps({'protocol_limits':limits,'source_sha256':frozen,'results':campaign,'original_stack_restored':True},indent=2)+'\n')
          PYPROBE
            PCS_REQUIRE_TRANSPORT_TRACE_KERNEL=1 python -m pytest -q tests/test_transport_trace_kernel_v1.py --junitxml="$RUNNER_TEMP/transport-diagnostic/trace-tests.xml"
            python scripts/run_transport_trace_kernel_v1.py --output "$RUNNER_TEMP/transport-diagnostic/trace" --signed-base "$RUNNER_TEMP/transport-diagnostic/model/signed-v3-base"
          ) 2>&1 | tee "$RUNNER_TEMP/transport-diagnostic/console.log"
          PCS_DIAGNOSTIC_STATUS=${PIPESTATUS[0]}
          export PCS_DIAGNOSTIC_STATUS
          python - <<'PY'
          import os
          from pathlib import Path
          if os.environ['PCS_DIAGNOSTIC_STATUS'] != '0':
              log = Path(os.environ['RUNNER_TEMP']) / 'transport-diagnostic/console.log'
              # GitHub truncates each annotation near4KiB; keep the actual end.
              tail = log.read_text(errors='replace').encode('ascii', 'backslashreplace').decode('ascii')[-12000:]
              chunks = [tail[i:i+2000] for i in range(0, len(tail), 2000)]
              for index, chunk in enumerate(chunks, 1):
                  escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Transport diagnostic {index}/{len(chunks)}::' + escaped)
          PY
          exit "$PCS_DIAGNOSTIC_STATUS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: authority-v2-inherited-transport-diagnostic
          path: ${{ runner.temp }}/transport-diagnostic
          retention-days: 14
