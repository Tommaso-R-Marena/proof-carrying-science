name: PCS EvidenceKernel selective-design research
on:
  pull_request:
    paths:
      - 'research/evidencekernel_selective_v16/**'
      - '.github/workflows/pcs-evidencekernel-selective-v16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-selection-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/evidencekernel_selective_v16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact finite worlds, adversarial inputs, cross-language replay
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Exact independent demonstration
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(cat example_pin.txt)"
          python kernel.py example_protocol.json example_evidence.json --protocol-pin "$PIN" > "$RUNNER_TEMP/ek-python.json"
          node independent.js example_protocol.json example_evidence.json "$PIN" > "$RUNNER_TEMP/ek-node.json"
          python - "$RUNNER_TEMP/ek-python.json" "$RUNNER_TEMP/ek-node.json" <<'PY'
          import json,sys
          a,b=(json.load(open(path)) for path in sys.argv[1:])
          assert a==b and a['conditional_robust_p']=='1/200'
          PY
