name: PCS Actual Local Model Weights
on:
  pull_request:
    paths:
      - 'research/local_weights_v1/**'
      - 'research/llm_firewall_v1/**'
      - '.github/workflows/pcs-local-weights-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weights-inference-and-independent-proof-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install pinned proof tools and Python dependencies
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Download exact real public GGUF weights and pinned CPU runtime
        run: python -m research.local_weights_v1 download "$RUNNER_TEMP/local-weights"
      - name: Require actual CPU inference and independent Lean tool replay
        env:
          PCS_REQUIRE_LOCAL_WEIGHTS: '1'
          PCS_REQUIRE_LOCAL_CAPTURE: '1'
          PCS_REQUIRE_LLM_FIXTURE: '1'
          PCS_LOCAL_WEIGHTS_DIR: ${{ runner.temp }}/local-weights
          PCS_LOCAL_INFERENCE_EVIDENCE: ${{ runner.temp }}/local-validation/inference
          PCS_LOCAL_REPLAY_EVIDENCE: ${{ runner.temp }}/local-validation/local-replay
          PCS_LLM_REPLAY_EVIDENCE: ${{ runner.temp }}/local-validation/hosted-capture-replay
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          mkdir -p "$RUNNER_TEMP/local-validation"
          python -m research.local_weights_v1.preservation > "$RUNNER_TEMP/local-validation/preservation.json"
          python -m research.integration_v1.source_gate > "$RUNNER_TEMP/local-validation/source-gate.json"
          python -m pytest -q research/local_weights_v1/test_local.py research/llm_firewall_v1/test_firewall.py tests/test_action_shield_v1.py --junitxml="$RUNNER_TEMP/local-validation/tests.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: actual-local-weight-inference-and-lean-replay
          path: ${{ runner.temp }}/local-validation
          retention-days: 14
