name: PCS Scientific Engines
on:
  pull_request:
    paths:
      - 'research/scientific_engines_v1/**'
      - '.github/workflows/pcs-scientific-engines-v1.yml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/activate_lean_428.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scientific-engines-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel-and-independent-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Prepare pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-dev.lock
          source scripts/activate_lean_428.sh
          lake exe cache get
      - name: Reproduce the upstream exact-checker baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scientific-evidence"
          python research/scientific_engines_v1/vendor/prism/tests/test_differential.py \
            > "$RUNNER_TEMP/scientific-evidence/prism-differential.txt"
          python research/scientific_engines_v1/vendor/prism/tests/test_serialization.py \
            > "$RUNNER_TEMP/scientific-evidence/prism-serialization.txt"
          python -m unittest discover -s research/scientific_engines_v1/vendor/aion/tests -v \
            > "$RUNNER_TEMP/scientific-evidence/aion-python.txt" 2>&1
      - name: Ordinary kernel proofs, strict inputs, hostile metadata and independent replay
        shell: bash
        env:
          PCS_SCIENTIFIC_REAL_LEAN: '1'
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          mkdir -p "$RUNNER_TEMP/scientific-evidence"
          python -m pytest research/scientific_engines_v1/test_parsing.py research/scientific_engines_v1/test_provenance.py research/scientific_engines_v1/test_publication.py research/scientific_engines_v1/test_authority.py -v \
            --basetemp="$RUNNER_TEMP/scientific-evidence/tests" \
            --junitxml="$RUNNER_TEMP/scientific-evidence/junit.xml"
          python -m research.scientific_engines_v1.preservation > "$RUNNER_TEMP/scientific-evidence/source-preservation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: scientific-engines-kernel-evidence
          path: ${{ runner.temp }}/scientific-evidence
