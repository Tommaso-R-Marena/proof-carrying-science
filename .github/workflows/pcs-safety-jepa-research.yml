name: Safety JEPA experimental research
on:
  pull_request:
    paths:
      - 'research/safety_jepa_v1/**'
      - '.github/workflows/pcs-safety-jepa-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safety-jepa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  safety-research:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Existing hash-pinned CPU dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock -r requirements-prover.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Actual effects, Lean invariants and neural contracts
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pytest -q research/safety_jepa_v1
          python -m research.safety_jepa_v1.verify --directory research/safety_jepa_v1/evidence
          python -m research.safety_jepa_v1.pilot_replay --directory research/safety_jepa_v1/evidence/real-qwen-pilot
          python -m research.safety_jepa_v1 --output "$RUNNER_TEMP/safety-jepa" --seeds 17 --epochs 1 --rl-episodes 4
          python -m research.safety_jepa_v1.replay --directory "$RUNNER_TEMP/safety-jepa" | tee "$RUNNER_TEMP/safety-jepa-replay.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: safety-jepa-evidence
          path: |
            ${{ runner.temp }}/safety-jepa/protocol.json
            ${{ runner.temp }}/safety-jepa/results.json.gz
            ${{ runner.temp }}/safety-jepa-replay.json
