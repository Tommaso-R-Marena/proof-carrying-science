name: PCS Exact Effects and Causal Noninterference
on:
  pull_request:
    paths:
      - 'research/causal_firewall_v1/**'
      - 'research/llm_firewall_v1/**'
      - 'research/local_weights_v1/**'
      - '.github/workflows/pcs-causal-firewall-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-effects-and-hostile-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install pinned proof tools and Python dependencies
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Require exact effects, causal theorem, hostile SQL and full offline replay
        env:
          PCS_REQUIRE_CAUSAL_FIXTURE: '1'
          PCS_CAUSAL_REPLAY_EVIDENCE: ${{ runner.temp }}/causal-formal/replay
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          mkdir -p "$RUNNER_TEMP/causal-formal"
          python -m research.causal_firewall_v1.preservation > "$RUNNER_TEMP/causal-formal/preservation.json"
          python -m research.integration_v1.source_gate > "$RUNNER_TEMP/causal-formal/source-gate.json"
          python scripts/audit_lean_source.py research/causal_firewall_v1/Refinement.lean research/causal_firewall_v1/Main.lean > "$RUNNER_TEMP/causal-formal/new-source-audit.log"
          python -m pytest -q research/causal_firewall_v1/test_effects.py research/causal_firewall_v1/test_capture.py tests/test_action_shield_v1.py --junitxml="$RUNNER_TEMP/causal-formal/tests.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: causal-exact-effect-formal-and-replay
          path: ${{ runner.temp }}/causal-formal
          retention-days: 14
  actual-weight-format-and-causal-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install pinned proof tools and Python dependencies
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Download real pinned official GGUF weights and CPU engine
        run: python -m research.local_weights_v1 download "$RUNNER_TEMP/local-weights"
      - name: Fresh native-plan experiments on actual weights, both formats and paired secrets
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python -m research.causal_firewall_v1 evaluate "$RUNNER_TEMP/local-weights" "$RUNNER_TEMP/causal-neural"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: causal-actual-weight-neural-campaign
          path: ${{ runner.temp }}/causal-neural
          retention-days: 14
